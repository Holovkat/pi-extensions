st's log |\n| `/req-close-panes` | Close all tmux log panes |\n| `/req-prd` | View PRD in glow (rendered markdown) |\n| `/req-rebuild-issues` | Re-publish all GitHub issues from checklist |\n| `/req-reset` | Clear session state and start fresh |\n\n## dev-pipeline Commands\n\n| Command | Description |\n|---------|-------------|\n| `/pipeline-start` | Initialize pipeline in Fast Track mode (default) |\n| `/pipeline-start --multiwave` | Initialize pipeline in 3-Wave mode |\n| `/pipeline-next` | Run next phase (uses active mode) |\n| `/pipeline-approve` | Approve UAT results (Fast Track) |\n| `/pipeline-reject` | Reject UAT with notes, loop back (Fast Track) |\n| `/pipeline-reset` | Full reset — checkout main, delete branches, uncheck, reopen |\n| `/pipeline-end` | UAT sign-off, squash merge to main, push, clean up |\n| `/pipeline-config` | Configure model assignments for each pipeline role |\n| `/pipeline-status` | Show current pipeline progress |\n| `/pipeline-dashboard` | Open live dashboard in tmux pane |\n| `/pipeline-logs` | Open all agent logs in tmux panes |\n| `/pipeline-watch <name>` | Tail a specific agent's log |\n| `/pipeline-close-panes` | Close all tmux/dashboard panes |\n\n## pi-blueprint Commands\n\n| Command | Description |\n|---------|-------------|\n| `/blueprint-status` | Show current planning phase and readiness |\n| `/blueprint-history` | Show consultation history |\n| `/blueprint-prd` | Open the generated PRD |\n| `/blueprint-checklist` | Open the generated checklist |\n| `/blueprint-web` | Open the live Blueprint web mirror |\n| `/blueprint-sync-assets` | Sync repo-managed agents and skills into local `.pi` |\n| `/blueprint-check-alignment` | Verify transcript-backed alignment |\n| `/blueprint-rebuild-issues` | Rebuild or recover GitHub issues |\n\n## council Commands\n\n| Command | Description |\n|---------|-------------|\n| `/council` | Refresh the council panel |\n| `/council --server` | Show hub URL, PID, queue/status counts, recent events |\n| `/council --reconnect` | Re-register and reopen the event stream |\n| `/council --project <name>` | View another project/council pool |\n\n## pi-toolshed Commands\n\n| Command | Description |\n|---------|-------------|\n| `/toolshed-web` | Open the toolshed web workspace |\n| `/toolshed-status` | Show current toolshed state |\n| `/toolshed-workspace` | Switch active workspace preset |\n| `/toolshed-freeze` | Freeze the active frontier into a packet |\n| `/toolshed-packets` | Inspect the packet queue |\n| `/toolshed-reset-layout` | Reset card collapse state |\n\n## Related Concepts\n\n- [Installation Guide](./installation-guide.md)\n- [Req-QA Extension](../components/req-qa-extension.md)\n- [Dev-Pipeline Extension](../components/dev-pipeline-extension.md)\n- [Pi-Blueprint Extension](../components/pi-blueprint-extension.md)\n- [Council Extension](../components/council-extension.md)\n- [Pi-Toolshed Extension](../components/pi-toolshed-extension.md)\n"},{"filepath":"process/comms-deployment.md","content":"---\ntype: Process\ntitle: Comms Deployment Profiles\ndescription: Deployment profiles for Pi-to-Pi comms — local coms (IPC), localhost council (auto-start hub), LAN hub (bearer token), and remote/TLS hub.\nresource: ./docs/comms.md\ntags: [pi-extensions, process, comms, council, deployment, lan, tls, security, profiles]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Comms Deployment Profiles\n\n`coms` and `council` provide first-version Pi-to-Pi request/response communication. They are intentionally not chat rooms, DMs, or shared session memory.\n\n## Local `coms` (Same-Machine IPC)\n\nUse `extensions/coms.ts` when all agents run as the same local user on the same machine. Uses Unix sockets on POSIX and named pipes on Windows.\n\n- Security boundary: same-user local IPC only\n- Cannot fully defend against a malicious same-user process\n- Do not use as a privilege boundary\n\n## Localhost `council` (Auto-Start Hub)\n\nThe first `council` agent auto-starts the hub on `127.0.0.1:48201` when no server is registered. Falls back to OS-assigned port if busy. Generates `server.secret.json` (mode 0600) if no auth token supplied.\n\nSet `PI_COUNCIL_AUTOSTART=0` to disable embedded startup and require an explicit server process.\n\n## LAN Hub\n\n```bash\nPI_COUNCIL_HOST=0.0.0.0 \\\nPI_COUNCIL_PORT=48201 \\\nPI_COUNCIL_PROJECT=my-project \\\nPI_COUNCIL_AUTH_TOKEN='<long-random-token>' \\\nbun scripts/council-server.ts\n```\n\nAgents connect with `PI_COUNCIL_SERVER_URL` and `PI_COUNCIL_AUTH_TOKEN`. Bearer token authenticates to hub. Hub issues per-agent session secrets so one token holder cannot act as another session.\n\n## Remote Hub / TLS\n\nPut the hub behind TLS and a reverse proxy. Do not expose plain HTTP over the internet. Use long random tokens, rotate after demos, prefer private networks/VPNs.\n\n## Environment Variables\n\nServer: `PI_COUNCIL_HOST`, `PI_COUNCIL_PORT`, `PI_COUNCIL_PROJECT`, `PI_COUNCIL_PUBLIC_URL`, `PI_COUNCIL_AUTH_TOKEN`, `PI_COUNCIL_MESSAGE_TTL_MS`, `PI_COUNCIL_MAX_INBOX`, `PI_COUNCIL_MAX_PROMPT_BYTES`, `PI_COUNCIL_MAX_RESPONSE_BYTES`, `PI_COUNCIL_LOG_HEARTBEAT`, `PI_COUNCIL_LOG_PAYLOADS`.\n\nClient: `PI_COUNCIL_SERVER_URL`, `PI_COUNCIL_AUTH_TOKEN`, `PI_COUNCIL_PROJECT`, `PI_COUNCIL_AUTOSTART`, `PI_COUNCIL_PORT`, `PI_COUNCIL_EMBEDDED_HOST`, `PI_COUNCIL_ASYNC_NOTIFY_GRACE_MS`, `PI_COUNCIL_INBOUND_RESPONSE_GRACE_MS`.\n\n## When Not to Use\n\nDo not use for: chat rooms, broadcast presence, shared live session mutation, security boundaries between hostile local processes, or durable multi-agent project memory by itself.\n\n## Related Concepts\n\n- [Council Architecture](../architecture/council-architecture.md)\n- [Council Extension](../components/council-extension.md)\n- [Async Council Default](../decisions/async-council-default.md)\n"},{"filepath":"process/comms-hardening-roadmap.md","content":"---\ntype: Process\ntitle: \"Pi-to-Pi Comms Hardening Roadmap\"\ndescription: Epic #93 roadmap for vendoring and hardening first-version Pi-to-Pi request/response communication, delivered across four sprints through production approval.\nresource: ./docs/comms.md\ntags: [pi-extensions, comms, council, github, issues]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\nissue_refs: [93, 94, 95, 96, 97]\n---\n\n# Pi-to-Pi Comms Hardening Roadmap\n\n## Overview\n\nEpic #93 brought the first-version Pi-to-Pi communication paradigm into this repo and hardened it without changing its core shape: one Pi agent sends a prompt to a peer Pi agent, then polls or awaits the peer's final assistant response. The upstream prototype from `disler/pi-vs-claude-code` was vendored as a local copy and evolved in-repo only. All four sprints shipped, passed UAT and QA, and were production-deployed and production-approved.\n\n**Epic issue:** #93\n**Labels:** epic, comms, uat-approved, qa-approved, production-deployed, production-approved\n**Closed:** 2026-05-20\n\n## Deliverables\n\nThe epic produced three extension artefacts:\n\n- `extensions/coms.ts` — same-machine peer discovery and request/response over local IPC (Unix socket / named pipe).\n- `extensions/council.ts` — networked request/response client over the Bun hub server.\n- `scripts/council-server.ts` — the networked hub server for council member discovery and message routing.\n- `docs/comms.md` — deployment profiles, security notes, lifecycle states, async behavior, and UAT scenarios.\n- Package: `@holovkat/pi-council` via `npm run build` producing `dist/council-package`.\n\nThe four-tool request/response model is preserved across both local and networked surfaces: `council_list` (discover peers), `council_send` (ask/assign work), `council_get` (non-blocking poll), `council_await` (blocking wait for synchronous sends).\n\n## Sprint Progression\n\n### Sprint v1.0 Hardening — #94\n\n**Focus:** Turn-bound response capture, queued delivery replay, pending reply TTL, truncation/body caps, path/lifecycle hardening.\n\n**Tasks delivered:**\n- #98 — Add first-version Pi-to-Pi comms baseline (vendored local and networked extension surfaces, complexity 4.0)\n- #99 — Bind inbound replies to the triggered assistant turn (response capture ignores stale messages, complexity 4.5)\n- #100 — Replay queued coms-net messages on reconnect (flush queued messages on SSE re-register, complexity 4.0)\n- #101 — Bound pending replies and payload sizes (TTL cleanup, size limits with truncation, complexity 4.0)\n- #102 — Harden registry paths and shutdown lifecycle (path traversal guards, idempotent shutdown, complexity 3.5)\n\n**Outcomes:** Core local and networked extension surfaces present. Receiver responses bound to correct inbound-triggered turn. Queued network messages replay after reconnect. Pending reply state bounded. Registry paths and shutdown lifecycle hardened.\n\n### Sprint v1.1 Safety — #95\n\n**Focus:** Per-agent ownership, spoofing guardrails, redacted audit logging, abuse-case tests.\n\n**Tasks delivered:**\n- #103 — Add per-agent ownership to coms-net (session-bound credential for lifecycle operations, complexity 4.5)\n- #104 — Harden local coms spoofing boundary (local envelope validation, trust-boundary docs, complexity 4.0)\n- #105 — Redact audit logging and add abuse tests (no prompt bodies in default logs, abuse coverage, complexity 3.5)\n\n**Outcomes:** Networked agents cannot impersonate other sessions. Local comms trust boundary explicit and documented. Prompt bodies not logged by default. Security abuse tests cover spoofing, oversized payloads, and unauthorized lifecycle operations.\n\n### Sprint v1.2 Ergonomics — #96\n\n**Focus:** Peer metadata, lifecycle states in tool output, operator documentation.\n\n**Tasks delivered:**\n- #106 — Add peer status, tags, and capabilities metadata (CLI flags/config for metadata, complexity 3.5)\n- #107 — Expose message lifecycle states in get/list/widget (queued/delivered/running/complete/error/expired, complexity 3.5)\n- #108 — Document first-version workflows and non-goals (same-machine and networked quick starts, non-goals, complexity 2.5)\n\n**Outcomes:** Peer metadata includes useful status/tags/capabilities. List/widget output helps agents choose the right peer. `*_get` reports useful lifecycle states. Operator docs explain first-version workflows and non-goals with planner/reviewer/coder examples.\n\n### Sprint v2.0 Packaging and Deployment — #97\n\n**Focus:** Installable Pi package, deployment profile documentation, optional structured-response validation.\n\n**Tasks delivered:**\n- #109 — Package comms as an installable Pi package (package manifest, build output, `pi install` path, complexity 4.0)\n- #110 — Document deployment profiles and optional structured responses (local/LAN/remote/TLS profiles, complexity 3.5)\n\n**Outcomes:** Package manifest and dist entrypoints exist. Local, LAN, and remote-hub deployment notes documented. Optional structured-response validation path specified. Smoke tests prove packaged install path.\n\n## Non-goals (preserved throughout)\n\n- Do not turn this into rooms, DMs, or cross-harness chat.\n- Do not replicate all peer state across the network.\n- Do not push routine presence/read events into model context.\n\n## Definition of Done (all met)\n\n- `coms` and `coms-net` (now `council`) retain the simple prompt/response API.\n- Inbound replies are correlated to the correct triggered turn.\n- Networked delivery survives temporary SSE disconnects.\n- Security-sensitive logs and credentials do not expose prompt contents or cross-agent impersonation paths.\n- Long-lived sessions do not leak unbounded pending reply state.\n- The extension can be installed and documented as a Pi package.\n\n## Complete Issue List\n\n| Issue | Title | Sprint |\n|-------|-------|--------|\n| #93 | Epic: Pi-to-Pi comms request/response hardening roadmap | — |\n| #94 | Sprint: comms v1.0 hardening | v1.0 |\n| #95 | Sprint: comms v1.1 safety | v1.1 |\n| #96 | Sprint: comms v1.2 ergonomics | v1.2 |\n| #97 | Sprint: comms v2.0 packaging and deployment | v2.0 |\n| #98 | Task: add first-version Pi-to-Pi comms baseline | v1.0 |\n| #99 | Task: bind inbound replies to the triggered assistant turn | v1.0 |\n| #100 | Task: replay queued coms-net messages on reconnect | v1.0 |\n| #101 | Task: bound pending replies and payload sizes | v1.0 |\n| #102 | Task: harden registry paths and shutdown lifecycle | v1.0 |\n| #103 | Task: add per-agent ownership to coms-net | v1.1 |\n| #104 | Task: harden local coms spoofing boundary | v1.1 |\n| #105 | Task: redact audit logging and add abuse tests | v1.1 |\n| #106 | Task: add peer status, tags, and capabilities metadata | v1.2 |\n| #107 | Task: expose message lifecycle states in get/list/widget | v1.2 |\n| #108 | Task: document first-version workflows and non-goals | v1.2 |\n| #109 | Task: package comms as an installable Pi package | v2.0 |\n| #110 | Task: document deployment profiles and optional structured responses | v2.0 |\n"},{"filepath":"process/fast-track-walkthrough.md","content":"---\ntype: Process\ntitle: Fast Track Walkthrough\ndescription: Step-by-step guide to running the fast track pipeline from a freshly generated PRD to a finished, UAT-approved project.\nresource: ./docs/walkthrough-fasttrack.md\ntags: [pi-extensions, process, fast-track, walkthrough, guide, uat, playwright]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Fast Track Walkthrough\n\nA step-by-step guide to running the fast track pipeline from a freshly generated PRD to a finished, UAT-approved project.\n\n## Prerequisites\n\n- PRD and implementation checklist generated via `pi-req`\n- GitHub issues published for all tasks\n- `pi-dev` alias configured\n- tmux running\n\n## Step 1: Start the Pipeline\n\n```bash\npi-dev\n/pipeline-start\n```\n\nThe extension parses the checklist, fetches GitHub issue bodies, shows the plan (tasks, model assignments, timeouts), and asks for confirmation. Creates the branch `feature/epic-1-<name>`.\n\n## Step 2: Automatic Epic Execution\n\nEach epic runs through four stages:\n1. **BUILD** — Gemini 3 Pro builds entire epic in one prompt\n2. **EVALUATE** — Opus 4.6 scores each task against acceptance criteria\n3. **FIX** — tasks below 95% get surgical fixes with watchdog timers and analyst escalation\n4. **UAT SCENARIOS** — evaluator generates test scenarios as GitHub issues\n\nPassed tasks are checked off in the checklist and their GitHub issues closed.\n\n## Step 3: Auto-Chain Through All Epics\n\nAfter each epic: creates next branch from current HEAD, resets tmux panes, pauses 3 seconds, starts next epic. Halts if an epic fails after 5 fix depths — manually fix and run `/pipeline-next` to resume.\n\n## Step 4: UAT Execution\n\n1. Server startup (`python3 -m http.server 8080`)\n2. Playwright executes each scenario (navigate, click, type, verify)\n3. Results posted as comments on each scenario issue\n4. Labels updated (`uat-pending` -> `uat-pass` or `uat-fail`)\n\n## Step 5: Approval Gate\n\nDashboard flashes \"AWAITING UAT APPROVAL\". Review results, then:\n\n- **Approve** (`/pipeline-approve`): closes UAT epic, then `/pipeline-end` for squash merge + push\n- **Reject** (`/pipeline-reject`): provide notes, failed scenarios reset, run `/pipeline-next` for fix cycle\n\n## Typical Timeline\n\n| Phase | Duration |\n|-------|----------|\n| Build (per epic) | 2-4 min |\n| Evaluate | 1-2 min |\n| Fix (per failed task) | 1-10 min |\n| Analyst review | 1-3 min |\n| UAT execution (all) | 5-15 min |\n| Total (9 epics + UAT) | ~45-120 min |\n\n## Related Concepts\n\n- [Fast Track Architecture](../architecture/fast-track-architecture.md)\n- [Sprint Development Workflow](./sprint-development-workflow.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n- [UAT Process](../domain/uat-process.md)\n- [Model Configuration](../architecture/model-configuration.md)\n"},{"filepath":"process/installation-guide.md","content":"---\ntype: Process\ntitle: Installation Guide\ndescription: Installation steps, shell aliases, and prerequisites for setting up pi-extensions.\nresource: ./README.md\ntags: [pi-extensions, process, installation, setup, aliases, prerequisites]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Installation Guide\n\n## Prerequisites\n\n- [pi coding agent CLI](https://github.com/nichochar/pi) installed globally\n- Node.js 20+\n- GitHub CLI (`gh`) authenticated for issue publishing\n- tmux (for log panes and dashboard)\n- Bun (for the embedded/local `council` hub server)\n- glow (optional, for `/req-prd` markdown rendering)\n\n## Installation Steps\n\n```bash\n# 1. Clone into your workspace\ngit clone <repo-url> ~/workspace/pi-extensions\n\n# 2. Symlink to ~/.pi-init (where pi loads from)\nln -sf ~/workspace/pi-extensions/extensions ~/.pi-init/extensions\nln -sf ~/workspace/pi-extensions/agents/req-qa/* ~/.pi-init/agents/\nln -sf ~/workspace/pi-extensions/agents/dev-pipeline/* ~/.pi-init/agents/\nln -sf ~/workspace/pi-extensions/bin/pipeline-dashboard ~/.pi-init/bin/pipeline-dashboard\nln -sf ~/workspace/pi-extensions/bin/pipeline-dashboard-web ~/.pi-init/bin/pipeline-dashboard-web\nln -sf ~/workspace/pi-extensions/bin/blueprint-dashboard-web ~/.pi-init/bin/blueprint-dashboard-web\nln -sf ~/workspace/pi-extensions/bin/toolshed-dashboard-web ~/.pi-init/bin/toolshed-dashboard-web\n\n# 3. Install dependencies\ncd ~/.pi-init && npm install @mariozechner/pi-tui\n\n# 4. Add aliases to ~/.zshrc\n_PIX=\"$HOME/.pi-init/extensions\"\nalias pi-dev='pi -ne -e \"$_PIX/dev-pipeline.ts\" -e \"$_PIX/theme-cycler.ts\"'\nalias pi-req='pi -ne -e \"$_PIX/req-qa.ts\" -e \"$_PIX/theme-cycler.ts\"'\nalias pi-blueprint='pi -ne -e \"$_PIX/pi-blueprint.ts\" -e \"$_PIX/theme-cycler.ts\"'\nalias pi-council='pi --no-extensions -e \"$_PIX/council.ts\"'\nalias pi-dash='~/.pi-init/bin/pipeline-dashboard'\nalias pi-web='~/.pi-init/bin/pipeline-dashboard-web'\n\n# 5. Install glow for PRD rendering (optional)\nbrew install glow\n```\n\n## Shell Aliases\n\n| Alias | Purpose |\n|-------|---------|\n| `pi-req` | Launch requirements discovery session |\n| `pi-dev` | Launch sprint development pipeline |\n| `pi-blueprint` | Launch the Blueprint planning cockpit |\n| `pi-council` | Launch a Pi session with the networked council extension |\n| `pi-dash` | Launch standalone terminal dashboard |\n| `pi-web` | Launch Pipeline Control Center (web, port 3141) |\n\n## Related Concepts\n\n- [Commands Reference](./commands-reference.md)\n- [System Architecture](../architecture/system-architecture.md)\n- [Council Extension](../components/council-extension.md)\n"},{"filepath":"process/requirements-discovery-workflow.md","content":"---\ntype: Process\ntitle: Requirements Discovery Workflow\ndescription: The req-qa interview loop — sequential specialist consultations, user review and refinement, sign-off, artifact generation, and GitHub issue publishing.\nresource: ./extensions/req-qa.ts\ntags: [pi-extensions, process, requirements, interview, consultation, sign-off, prd, checklist]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Requirements Discovery Workflow\n\nThe req-qa workflow is an interactive, human-in-the-loop requirements discovery process.\n\n## Interview Loop\n\n1. User describes what they want to build\n2. Orchestrator asks interview questions (one at a time)\n3. User provides answers and context\n4. Orchestrator calls `consult_specialist` for each specialist sequentially:\n   - `req-analyst` — functional/non-functional requirements\n   - `tech-analyst` — technical feasibility and stack\n   - `scenario-analyst` — stress tests and failure modes\n5. After each consultation, findings are presented to the user for feedback\n6. User refines or asks for changes — loop back to interview\n7. User signs off when satisfied\n\n## Artifact Generation\n\nAfter sign-off, `generate_artifacts` is called:\n1. The `prd-writer` agent is spawned as a subprocess\n2. It synthesizes all analysis into `PRD.md` and an implementation checklist\n3. Files are written to disk\n4. The extension parses the checklist for epics and tasks\n5. GitHub issues are created for each epic (tracking) and task (linked via `Part of #N`)\n6. Checklist is updated with issue numbers\n\n## Session Persistence\n\nState is saved to `req-qa-state.json` after every consultation and phase change. On startup:\n- Has consultation history -> resume (inject history into system prompt)\n- Has existing PRD -> enhance (inject PRD content for refinement)\n- Neither -> fresh start\n\nThe `before_agent_start` hook dynamically injects context into the orchestrator's system prompt, giving it full context without re-running specialists.\n\n## Consultation Modes\n\n- **Fast mode** (default): ~15s per call, no file tools\n- **Deep mode**: ~30-60s per call, with file-reading tools and session persistence\n\n## Related Concepts\n\n- [Req-QA Extension](../components/req-qa-extension.md)\n- [Specialist Agents](../domain/specialist-agents.md)\n- [GitHub Integration](../architecture/github-integration.md)\n- [Sprint Development Workflow](./sprint-development-workflow.md)\n- [System Architecture](../architecture/system-architecture.md)\n"},{"filepath":"process/sprint-development-workflow.md","content":"---\ntype: Process\ntitle: Sprint Development Workflow\ndescription: The dev-pipeline sprint flow — pipeline start, epic auto-chaining, task execution through build/eval/fix/UAT, and final merge.\nresource: ./extensions/dev-pipeline.ts\ntags: [pi-extensions, process, sprint, pipeline, epic, chaining, merge, uat]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Sprint Development Workflow\n\nThe dev-pipeline workflow reads the checklist produced by req-qa and drives tasks through development, compliance, and quality gates.\n\n## Pipeline Start\n\n1. `/pipeline-start` parses the checklist — identifies all epics and tasks\n2. Fetches full issue bodies from GitHub via `gh issue view` for complete acceptance criteria\n3. Shows the plan (epics, tasks, model assignments, timeouts, compliance threshold)\n4. User confirms\n5. Creates the branch `feature/epic-N-<name>`\n\n## Epic Execution (Fast Track)\n\nEach epic runs through stages automatically:\n1. **BUILD** — single model builds entire epic\n2. **EVALUATE** — stronger model scores each task per acceptance criteria\n3. **FIX** — tasks below 95% get surgical fixes with watchdog timers and analyst escalation\n4. **UAT SCENARIOS** — evaluator generates test scenarios as GitHub issues\n5. **CHECKLIST UPDATE** — passed tasks checked off, issues closed\n\n## Epic Execution (3-Wave)\n\n1. **Wave 1** — 3 architects in parallel, consolidated into unified spec\n2. **Wave 0** — 3-step prototype (first epic only)\n3. **Wave 1** — review and TODO placement\n4. **Wave 2** — sequential dev sprint with compliance scoring and fix retries\n\n## Auto-Chaining\n\nAfter each epic completes:\n1. Creates next branch from current HEAD (preserving previous epic's code)\n2. Resets tmux panes\n3. Pauses 3 seconds\n4. Starts next epic automatically\n\nHalts if an epic fails (tasks can't reach 95% after 5 fix depths).\n\n## UAT and Merge\n\n1. After all epics pass, Playwright runs all UAT scenarios\n2. Results posted to GitHub issues\n3. Pipeline halts at approval gate\n4. `/pipeline-approve` -> close UAT epic -> `/pipeline-end` -> squash merge + push\n5. `/pipeline-reject` -> post notes to failed issues -> `/pipeline-next` -> fix cycle\n\n## Related Concepts\n\n- [Fast Track Architecture](../architecture/fast-track-architecture.md)\n- [Three-Wave Architecture](../architecture/three-wave-architecture.md)\n- [UAT Process](../domain/uat-process.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n- [Fast Track Walkthrough](./fast-track-walkthrough.md)\n- [Requirements Discovery Workflow](./requirements-discovery-workflow.md)\n"},{"filepath":"process/toolshed-implementation.md","content":"---\ntype: Process\ntitle: Toolshed Implementation\ndescription: Implementation instructions for the pi-toolshed lane-first web workspace — files, reference implementations, state model, widget contract, and build order.\nresource: ./TOOLSHED-IMPLEMENTATION-INSTRUCTIONS.md\ntags: [pi-extensions, process, toolshed, implementation, lane, widgets, workspace, build-order]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Toolshed Implementation\n\nImplementation instructions for the pi-toolshed extension and browser host, delivering the PRD using existing repo patterns plus FMS-GLM lane discipline.\n\n## Files to Create\n\n- `extensions/pi-toolshed.ts` — extension with command surface, web host management, runtime state, control channel\n- `bin/toolshed-dashboard-web` — single-page UI shell with SSE, control endpoint, state restoration\n- Optional helper modules in `extensions/lib/` if needed\n\n## Reference Implementations\n\n- `extensions/pi-blueprint.ts` — session management, web host orchestration, state persistence\n- `bin/blueprint-dashboard-web` — SSE state broadcast, widget/overlay patterns, control socket\n- `extensions/dev-pipeline.ts` — operator control actions, command steering, approval patterns\n- `../fms-glm` — UX reference for single centered lane, floating header, freeze/inject discipline\n\n## State Model\n\n```ts\ninterface ToolshedState {\n  sessionId: string;\n  projectDir: string;\n  workspaceId: string;\n  status: ToolshedStatus;\n  lane: LaneItem[];\n  packets: ToolshedPacket[];\n  widgets: WidgetInstanceState[];\n  mcp: McpSummaryState;\n  composer: ComposerState;\n  updatedAt: string;\n}\n```\n\n## Widget Contract\n\n```ts\ntype WidgetPlacement = \"inline\" | \"left-dock\" | \"right-dock\" | \"float\";\ninterface WidgetDefinition {\n  id: string; title: string; workspaceId: string;\n  placement: WidgetPlacement; purpose: string;\n  defaultPinned: boolean; renderMode: \"summary\" | \"interactive\" | \"packet-staging\";\n  actions: Array<{ id: string; label: string }>;\n}\n```\n\n## Build Order\n\n1. Shell and state plumbing (SSE, port discovery)\n2. Lane-first UI (centered lane, floating header, bottom composer)\n3. Core controls (send, steer, abort, slash commands, skills)\n4. Workspace and widget registry (10 presets, 30 widgets)\n5. MCP and RFC flows (server visibility, packet injection)\n6. Hardening (reconnect, long transcript, empty states)\n\n## Lane Rules\n\n- Keep one centered scrollable lane\n- Allow only one active frontier\n- Freeze resolved work into packets\n- Inject packets intentionally, never implicitly\n- Never create a permanent multi-column dashboard as primary UI\n\n## Definition of Done\n\n1. Extension and web host exist and work together\n2. Lane-first UI can chat with Pi in real time\n3. Slash commands, skills, RFC actions, and MCP summaries visible\n4. All 10 workspace presets and 30 widgets registered\n5. Validation and smoke checks pass\n\n## Related Concepts\n\n- [Pi-Toolshed Extension](../components/pi-toolshed-extension.md)\n- [Pi-Blueprint Extension](../components/pi-blueprint-extension.md)\n- [Current Repo State](../state/current-repo-state.md)\n"},{"filepath":"state/comms-delivery-state.md","content":"---\ntype: State\ntitle: \"Comms Delivery State\"\ndescription: All four comms hardening sprints are complete, production-deployed, and production-approved. No active work remains on the comms epic.\nresource: ./docs/comms.md\ntags: [pi-extensions, comms, council, github, issues]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\nissue_refs: [93]\n---\n\n# Comms Delivery State\n\n## Current Status: Complete\n\nThe Pi-to-Pi comms hardening epic (#93) is fully delivered. All four sprints shipped, passed UAT, passed QA, and were production-deployed and production-approved. There is no active or pending work on the comms epic.\n\n## Release Gates Passed\n\n| Gate | Status |\n|------|--------|\n| UAT | Approved |\n| QA | Approved |\n| Production Deploy | Deployed |\n| Production Approval | Approved |\n\nAll 18 issues (#93 through #110) are closed.\n\n## Delivered Artefacts\n\n| Artefact | Path | Description |\n|----------|------|-------------|\n| Local comms | `extensions/coms.ts` | Same-machine peer discovery and request/response over local IPC |\n| Networked council | `extensions/council.ts` | Networked request/response client over Bun hub |\n| Hub server | `scripts/council-server.ts` | Council hub server for member discovery and message routing |\n| Documentation | `docs/comms.md` | Deployment profiles, security notes, lifecycle states, UAT scenarios |\n| Package | `dist/council-package` | Installable Pi package (`@holovkat/pi-council`) via `npm run build` |\n\n## What Works\n\n- **Local comms** (`coms.ts`): same-machine request/response over Unix socket / named pipe with spoofing guardrails and path traversal protection.\n- **Networked council** (`council.ts` + `council-server.ts`): async request/response with per-agent session credentials, queued message replay on reconnect, bounded pending replies, and redacted audit logging.\n- **Peer metadata**: status, tags, and capabilities for agent selection without chat/room semantics.\n- **Lifecycle states**: queued, delivered, running, complete, error, and expired states surfaced in `*_get`, `*_list`, and widget.\n- **Packaging**: installable via `pi install` with smoke-tested packaged install path.\n- **Deployment profiles**: local, localhost, LAN hub, and remote/TLS documented with environment variables and security cautions.\n\n## What Is Not Active\n\n- No open sprints or tasks under the comms epic.\n- No pending follow-ups identified (optional structured-response validation was specified or implemented in #110).\n- The epic's non-goals (rooms, DMs, cross-harness chat, full peer state replication, routine presence events) remain excluded by design.\n\n## Related Concepts\n\n- [Pi-to-Pi Comms Hardening Roadmap](../process/comms-hardening-roadmap.md) — full sprint progression and task breakdown.\n"},{"filepath":"state/current-repo-state.md","content":"---\ntype: State\ntitle: Current Repo State\ndescription: Current state of the pi-extensions repository — baseline extensions, blueprint, toolshed, council, and roadmap status as of June 2026.\nresource: ./README.md\ntags: [pi-extensions, state, current, repo, status, roadmap]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Current Repo State\n\n## Baseline Extensions\n\n- `req-qa` and `dev-pipeline` remain the baseline discovery and delivery workflow extensions.\n- `pi-blueprint.ts` is the current GitHub-backed planning cockpit, with transcript search, alignment checks, issue rebuilds, asset sync, and a dedicated web mirror.\n- `pi-toolshed.ts` is the current card/workspace shell, with frontier packets, workspace presets, quick actions, and blueprint-aware web surfaces.\n- `council.ts` is the networked Pi-to-Pi council layer: agents discover council members, select by purpose/tags/capabilities, and exchange async request/response work over `scripts/council-server.ts`.\n\n## Asset Management\n\nBlueprint assets are committed in `agents/pi-blueprint/` and `skills/pi-blueprint/`; use `/blueprint-sync-assets` to mirror them into a project-local `.pi` runtime.\n\n## Roadmap Status\n\n### Pi-to-Pi Comms (Complete)\n- Comms v1.0-v2.0: production approved / release complete\n- Includes local coms, networked council, packaging, deployment profiles\n\n### Pi Builder (Planned)\n- `pi-builder` does not exist yet on master\n- Planned as a task-first execution engine alongside `dev-pipeline`\n- 7-phase roadmap: spec recovery, extension standup, task-first intake, warm builder, narrow review/testing, sync/stop, end-to-end pilots\n- Complexity gate: reject tasks above 5/10 before execution\n\n### Pi Council Mediation (Planned)\n- `pi-council` is a mediator/orchestrator layer above local coms and networked council\n- Will use an explicit lightweight JSONL blackboard for shared collaboration memory\n- 6 tasks across extension shell, blackboard tools, registry, mediated rounds, records, and documentation\n\n## Supporting Extensions\n\n- `themeMap.ts` — maps extensions to default themes\n- `theme-cycler.ts` — runtime theme switching\n- `ollama-provider.ts` — local and cloud-proxied Ollama models\n- `apfel-provider.ts` — Apple FoundationModels via `apfel --serve`\n\n## Related Concepts\n\n- [System Architecture](../architecture/system-architecture.md)\n- [Pi-Blueprint Extension](../components/pi-blueprint-extension.md)\n- [Pi-Toolshed Extension](../components/pi-toolshed-extension.md)\n- [Council Extension](../components/council-extension.md)\n- [Comms Deployment](../process/comms-deployment.md)\n"}];
let currentView = 'browse';

function parseFrontmatter(content) {
  const match = content.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) return { frontmatter: {}, body: content };
  const yaml = match[1], body = match[2], fm = {};
  for (const line of yaml.split('\n')) {
    const m = line.match(/^(\w+):\s*(.*)$/);
    if (!m) continue;
    const key = m[1]; let value = m[2].trim();
    if (value.startsWith('[') && value.endsWith(']')) {
      const inner = value.slice(1, -1).trim();
      fm[key] = inner ? inner.split(',').map(s => s.trim().replace(/^["']|["']$/g, '')) : [];
    } else { fm[key] = value.replace(/^["']|["']$/g, ''); }
  }
  return { frontmatter: fm, body };
}

function extractLinks(body, basePath) {
  const links = [];
  const regex = /\[([^\]]+)\]\(([^)]+\.md)\)/g;
  let match;
  while ((match = regex.exec(body)) !== null) {
    let target = match[2];
    if (target.startsWith('http')) continue;
    const baseDir = basePath.includes('/') ? basePath.split('/').slice(0, -1).join('/') : '';
    if (target.startsWith('./')) target = target.slice(2);
    if (target.startsWith('../')) {
      const parts = (baseDir ? baseDir.split('/') : []).concat(target.split('/'));
      const resolved = [];
      for (const p of parts) { if (p === '..') resolved.pop(); else if (p !== '.' && p !== '') resolved.push(p); }
      target = resolved.join('/');
    } else if (baseDir) { target = baseDir + '/' + target; }
    links.push({ label: match[1], target });
  }
  return links;
}

function slugToId(fp) { return fp.replace(/\.md$/, ''); }

function getConceptType(fp, fm) {
  if (fm.type) return fm.type;
  for (const d of DIR_ORDER) { if (fp.includes(d + '/')) return d.charAt(0).toUpperCase() + d.slice(1); }
  return 'unknown';
}

function buildConcept(item) {
  const { frontmatter, body } = parseFrontmatter(item.content);
  const type = getConceptType(item.filepath, frontmatter);
  const id = slugToId(item.filepath);
  const links = extractLinks(body, item.filepath);
  return {
    id, filepath: item.filepath, filename: item.filepath.split('/').pop(),
    frontmatter, body, type, links, backlinks: [],
    title: frontmatter.title || item.filepath.replace(/\.md$/, '').replace(/-/g, ' '),
    description: frontmatter.description || '',
    tags: Array.isArray(frontmatter.tags) ? frontmatter.tags : [],
    status: frontmatter.status || 'active',
    resource: frontmatter.resource || '',
    issueRefs: Array.isArray(frontmatter.issue_refs) ? frontmatter.issue_refs : [],
  };
}

function processConcepts(items) {
  allConcepts = items.map(buildConcept);
  const conceptIds = new Set(allConcepts.map(c => c.id));
  allLinks = [];
  const backlinks = new Map();
  for (const c of allConcepts) {
    for (const link of c.links) {
      const tid = slugToId(link.target);
      if (conceptIds.has(tid)) {
        allLinks.push({ source: c.id, target: tid });
        if (!backlinks.has(tid)) backlinks.set(tid, []);
        backlinks.get(tid).push(c.id);
      }
    }
  }
  for (const c of allConcepts) c.backlinks = backlinks.get(c.id) || [];
}

async function readDirectory(dirHandle, prefix = '') {
  const results = [];
  for await (const [name, handle] of dirHandle.entries()) {
    if (name === 'index.md' || name === 'log.md' || name.startsWith('.') || name.endsWith('.html') || name.endsWith('.js')) continue;
    const p = prefix ? prefix + '/' + name : name;
    if (handle.kind === 'directory') { results.push(...await readDirectory(handle, p)); }
    else if (name.endsWith('.md')) { results.push({ filepath: p, content: await (await handle.getFile()).text() }); }
  }
  return results;
}

async function loadFolder(dirHandle) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('folder-btn').disabled = true;
  try {
    const items = await readDirectory(dirHandle);
    processConcepts(items);
    onDataLoaded();
  } catch (err) { alert('Error: ' + err.message); }
  finally { document.getElementById('loading').style.display = 'none'; }
}

function onDataLoaded() {
  renderTree();
  renderGraph();
  renderFilters();
  document.getElementById('stats').textContent = `${allConcepts.length} concepts | ${allLinks.length} links`;
  document.getElementById('folder-btn').textContent = allConcepts.length + ' loaded';
  document.getElementById('folder-btn').disabled = true;
}

/* ---- Folder Tree ---- */
function renderTree() {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  const grouped = {};
  for (const c of allConcepts) {
    const dir = c.filepath.includes('/') ? c.filepath.split('/')[0] : 'root';
    if (!grouped[dir]) grouped[dir] = [];
    grouped[dir].push(c);
  }
  const search = document.getElementById('search').value.toLowerCase();
  for (const dir of DIR_ORDER) {
    const concepts = (grouped[dir] || []).filter(c => {
      if (!search) return true;
      return c.title.toLowerCase().includes(search) || c.id.toLowerCase().includes(search) ||
        c.tags.some(t => t.toLowerCase().includes(search)) || (c.description && c.description.toLowerCase().includes(search));
    });
    if (concepts.length === 0) continue;
    const typeLabel = dir.charAt(0).toUpperCase() + dir.slice(1);
    const color = TYPE_COLORS[typeLabel] || '#8b949e';

    const dirEl = document.createElement('div');
    dirEl.className = 'tree-dir';
    dirEl.innerHTML = `<span class="arrow">▼</span><span class="dir-dot" style="background:${color}"></span>${typeLabel}<span class="dir-count">${concepts.length}</span>`;
    dirEl.onclick = () => {
      dirEl.classList.toggle('collapsed');
      filesEl.classList.toggle('collapsed');
    };

    const filesEl = document.createElement('div');
    filesEl.className = 'tree-files';
    for (const c of concepts.sort((a, b) => a.title.localeCompare(b.title))) {
      const fEl = document.createElement('div');
      fEl.className = 'tree-file';
      fEl.dataset.id = c.id;
      fEl.textContent = c.title;
      if (c.status === 'deprecated') fEl.innerHTML += '<span class="file-status">○</span>';
      fEl.onclick = () => {
        document.querySelectorAll('.tree-file').forEach(e => e.classList.remove('active'));
        fEl.classList.add('active');
        showDetail(c, 'detail');
      };
      filesEl.appendChild(fEl);
    }
    tree.appendChild(dirEl);
    tree.appendChild(filesEl);
  }
}

/* ---- Detail Panel ---- */
function showDetail(concept, targetId) {
  const el = document.getElementById(targetId);
  const fm = concept.frontmatter;
  const fmLines = [];
  if (fm.resource) fmLines.push(`<div>resource: <a href="${fm.resource}" target="_blank">${fm.resource}</a></div>`);
  if (fm.timestamp) fmLines.push(`<div>timestamp: ${fm.timestamp}</div>`);
  if (concept.issueRefs.length) fmLines.push(`<div>issue_refs: [${concept.issueRefs.join(', ')}]</div>`);
  if (fm.supersedes && Array.isArray(fm.supersedes) && fm.supersedes.length) fmLines.push(`<div>supersedes: [${fm.supersedes.join(', ')}]</div>`);

  const badges = [`<span class="badge type" data-type="${concept.type}">${concept.type}</span>`];
  if (concept.status && concept.status !== 'active')
    badges.push(`<span class="badge status ${concept.status === 'deprecated' ? 'deprecated' : ''}">${concept.status}</span>`);
  if (concept.tags.length) badges.push(...concept.tags.map(t => `<span class="badge">${t}</span>`));

  const backlinkHtml = concept.backlinks.length ? `
    <div class="backlinks"><h3>Cited by (${concept.backlinks.length})</h3>
    ${concept.backlinks.map(id => { const c = allConcepts.find(x => x.id === id); return c ? `<a data-id="${id}">${c.title}</a>` : ''; }).join('')}
    </div>` : '';

  el.innerHTML = `<div class="content">
    <h2>${concept.title}</h2>
    <div class="meta">${badges.join('')}</div>
    ${fmLines.length ? `<div class="frontmatter">${fmLines.join('')}</div>` : ''}
    <div class="body">${marked.parse(concept.body)}</div>
    ${backlinkHtml}
  </div>`;

  // Attach backlink click handlers first (before mermaid, which can throw)
  el.querySelectorAll('.backlinks a').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const c = allConcepts.find(x => x.id === a.dataset.id);
      if (c) { showDetail(c, targetId); if (cy) cy.getElementById(c.id).select(); }
    };
  });

  // Intercept relative .md links in body and frontmatter
  el.querySelectorAll('.body a[href], .frontmatter a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href || href.startsWith('http') || href.startsWith('#')) return;
    a.onclick = (e) => {
      e.preventDefault();
      // Resolve relative path from current concept's directory
      const baseDir = concept.id.includes('/') ? concept.id.substring(0, concept.id.lastIndexOf('/') + 1) : '';
      let resolved = baseDir + href;
      // Normalise path segments
      while (resolved.includes('../')) {
        resolved = resolved.replace(/[^/]+\/\.\.\//, '');
      }
      resolved = resolved.replace(/\/\.\//g, '/');
      resolved = resolved.replace(/^\.\//, '');
      // Strip .md extension to match concept IDs
      resolved = resolved.replace(/\.md$/, '');
      const target = allConcepts.find(x => x.id === resolved);
      if (target) {
        showDetail(target, targetId);
        if (cy) cy.getElementById(target.id).select();
      }
    };
  });

  // Render mermaid diagrams (wrapped in try-catch so errors don't break navigation)
  try {
    el.querySelectorAll('pre code').forEach((codeEl, i) => {
      const text = codeEl.textContent.trim();
      if (text.startsWith('erDiagram') || text.startsWith('flowchart') || text.startsWith('graph') || text.startsWith('sequenceDiagram')) {
        const pre = codeEl.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.id = 'mermaid-' + Date.now() + '-' + i;
        div.textContent = text;
        pre.replaceWith(div);
      }
    });
    const mermaidNodes = el.querySelectorAll('.mermaid');
    if (mermaidNodes.length > 0 && typeof mermaid !== 'undefined') {
      mermaid.run({ nodes: mermaidNodes }).catch(() => {});
    }
  } catch (e) { /* mermaid not loaded or render error - ignore */ }

  el.scrollTop = 0;
}

/* ---- Graph ---- */
function renderGraph() {
  const nodes = allConcepts.map(c => ({ data: { id: c.id, label: c.title.length > 28 ? c.title.slice(0, 26) + '..' : c.title, type: c.type, color: TYPE_COLORS[c.type] || '#8b949e', concept: c } }));
  const edges = allLinks.map((l, i) => ({ data: { id: 'e' + i, source: l.source, target: l.target } }));
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: [...nodes, ...edges],
    style: [
      { selector: 'node', style: { 'background-color': 'data(color)', 'label': 'data(label)', 'color': '#c9d1d9', 'font-size': '10px', 'text-valign': 'bottom', 'text-halign': 'center', 'text-margin-y': 4, 'width': 22, 'height': 22, 'border-width': 2, 'border-color': '#21262d', 'text-wrap': 'ellipsis', 'text-max-width': '120px' }},
      { selector: 'node:selected', style: { 'border-width': 3, 'border-color': '#f0f6fc', 'width': 28, 'height': 28 }},
      { selector: 'edge', style: { 'width': 1, 'line-color': '#30363d', 'target-arrow-color': '#30363d', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': 0.6 }},
      { selector: '.deprecated', style: { 'border-style': 'dashed', 'opacity': 0.5 }}
    ],
    layout: { name: 'cose', animate: true, padding: 40, idealEdgeLength: 80, nodeRepulsion: 8000 }
  });
  cy.nodes().forEach(n => { if (n.data('concept').status === 'deprecated') n.addClass('deprecated'); });
  cy.on('tap', 'node', evt => showDetail(evt.target.data('concept'), 'graph-detail'));
}

function renderFilters() {
  const tb = document.getElementById('toolbar');
  document.querySelectorAll('.filter-btn').forEach(e => e.remove());
  for (const type of [...new Set(allConcepts.map(c => c.type))].sort()) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active'; btn.dataset.type = type; btn.textContent = type;
    btn.onclick = () => {
      if (activeFilters.has(type)) { activeFilters.delete(type); btn.classList.remove('active'); }
      else { activeFilters.add(type); btn.classList.add('active'); }
      applyFilters();
    };
    tb.insertBefore(btn, document.getElementById('search'));
  }
}

function applyFilters() {
  if (currentView !== 'graph' || !cy) return;
  const s = document.getElementById('search').value.toLowerCase();
  cy.nodes().forEach(n => {
    const c = n.data('concept');
    const tm = activeFilters.size === 0 || activeFilters.has(c.type);
    const sm = !s || c.title.toLowerCase().includes(s) || c.id.toLowerCase().includes(s) || c.tags.some(t => t.toLowerCase().includes(s));
    n.style('display', (tm && sm) ? 'element' : 'none');
  });
  cy.edges().forEach(e => {
    e.style('display', (cy.getElementById(e.data('source')).style('display') !== 'none' && cy.getElementById(e.data('target')).style('display') !== 'none') ? 'element' : 'none');
  });
}

/* ---- Navigation ---- */
function switchView(view) {
  currentView = view;
  document.getElementById('nav-browse').classList.toggle('active', view === 'browse');
  document.getElementById('nav-graph').classList.toggle('active', view === 'graph');
  document.getElementById('browse-view').classList.toggle('active', view === 'browse');
  document.getElementById('graph-view').classList.toggle('active', view === 'graph');
  if (view === 'graph' && cy) cy.resize();
  if (view === 'browse') renderTree();
}
document.getElementById('nav-browse').onclick = () => switchView('browse');
document.getElementById('nav-graph').onclick = () => switchView('graph');

/* ---- Search ---- */
document.getElementById('search').oninput = () => {
  if (currentView === 'browse') renderTree();
  else applyFilters();
};

/* ---- Folder picker ---- */
document.getElementById('folder-btn').onclick = async () => {
  try { await loadFolder(await window.showDirectoryPicker()); }
  catch (err) { if (err.name !== 'AbortError') alert('Error: ' + err.message); }
};

/* ---- Auto-load embedded data ---- */
function loadEmbeddedData() {
  if (typeof __OKF_DATA__ !== 'undefined' && __OKF_DATA__ && Array.isArray(__OKF_DATA__)) {
    processConcepts(__OKF_DATA__.map(item => ({ filepath: item.filepath, content: item.content })));
    onDataLoaded();
  }
}
loadEmbeddedData();

/* ---- Drag and drop ---- */
let dragCounter = 0;
window.addEventListener('dragenter', (e) => { e.preventDefault(); dragCounter++; document.getElementById('drop-zone').style.display = 'flex'; });
window.addEventListener('dragleave', (e) => { e.preventDefault(); dragCounter--; if (dragCounter === 0) document.getElementById('drop-zone').style.display = 'none'; });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault(); dragCounter = 0;
  document.getElementById('drop-zone').style.display = 'none';
  const items = e.dataTransfer.items;
  if (items && items.length > 0 && items[0].webkitGetAsEntry) {
    const entry = items[0].webkitGetAsEntry();
    if (entry.isDirectory) {
      try { const handle = await entry.getFilesystemHandle?.(); if (handle) await loadFolder(handle); } catch {}
    }
  }
});
</script>
</body>
