__OKF_DATA__ = [{"filepath":"architecture/agent-subprocess-execution.md","content":"---\ntype: Architecture\ntitle: Agent Subprocess Execution Model\ndescription: How extensions spawn pi CLI agents as RPC-mode subprocesses with stdin/stdout piping, mid-execution steering, and session reuse.\nresource: ./README.md\ntags: [pi-extensions, architecture, rpc, subprocess, steering, session-reuse]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Agent Subprocess Execution Model\n\nBoth `req-qa` and `dev-pipeline` spawn agents as pi CLI subprocesses using pi's native RPC mode.\n\n## Spawn Pattern\n\n```\npi --mode rpc --no-extensions --no-skills --system-prompt '...'\n```\n\n- stdin and stdout are piped\n- The task is sent via stdin as `{\"type\": \"prompt\", \"message\": \"...\"}` — not as a positional arg\n- Output streams as JSON events (`message_update`, `agent_start`, `agent_end`, `tool_execution_start`, etc.)\n- All output is logged to `.pi/pipeline-logs/<session-key>.log`\n\n## RPC Commands\n\n| Command | Effect |\n|---------|--------|\n| `{\"type\": \"prompt\", \"message\": \"...\"}` | Send initial task (on spawn) |\n| `{\"type\": \"steer\", \"message\": \"...\"}` | Interrupt agent, deliver new instructions |\n| `{\"type\": \"follow_up\", \"message\": \"...\"}` | Continue conversation after `agent_end` (if keepAlive) |\n| `{\"type\": \"abort\"}` | Cancel current execution |\n\n## Session Reuse\n\nUses `--session <file> -c` so agents retain conversation context across calls within a phase. A dev agent called for task 1.1 keeps its context when called again for task 1.2, reducing repeated codebase scanning.\n\n## RPC Lifecycle\n\n`prompt` -> `agent_start` -> `turn_start` -> `message_start` -> `message_update` (text deltas) -> `message_end` -> `tool_execution_start/end` (if tools used) -> `turn_end` -> `agent_end` -> `stdin.end()` (or keep alive for follow-up).\n\n## Steering Sources\n\n1. **Watchdog timer** — automatic yield summary request at timeout\n2. **Web UI** — user types a message on the `/steer` page\n3. **Control socket** — programmatic steering from any TCP client (port 3142)\n\n## Process Tracking\n\nAgents are tracked in the `agentProcesses` map by session key for steering and monitoring. The extension auto-connects to the control socket on startup and re-registers agents on reconnect.\n\n## Related Concepts\n\n- [Pipeline State System](./pipeline-state-system.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n- [RPC Mode for Subprocesses](../decisions/rpc-mode-for-subprocesses.md)\n- [Pipeline Dashboard Web](../components/pipeline-dashboard-web.md)\n"},{"filepath":"architecture/council-architecture.md","content":"---\ntype: Architecture\ntitle: Networked Council Architecture\ndescription: Networked request/response council where Pi agents discover members, select by metadata, and exchange async work over a Bun HTTP/SSE hub.\nresource: ./extensions/council.ts\ntags: [pi-extensions, architecture, council, networked, hub, sse, async, discovery]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Networked Council Architecture\n\nA networked request/response council for multiple Pi agents. The first agent in a project auto-starts a local council hub when needed; additional agents join the same project and advertise metadata so the questioner can choose the best member for each task.\n\n## Hub Server\n\nThe council hub (`scripts/council-server.ts`) is a Bun HTTP/SSE server. By default, the first `council` agent auto-starts the hub on `127.0.0.1:48201` when no server is registered for the project. If the port is busy, it falls back to an OS-assigned port and writes the actual URL to `~/.pi/council/projects/<project>/server.json`.\n\n## Member Discovery\n\nAgents advertise lightweight metadata via CLI flags:\n\n```bash\npi -e extensions/council.ts --name net-alice --project council-uat \\\n  --tags planner --capabilities planning,review --status \"review-ready\"\n```\n\n`council_list` returns members with name, model, purpose, status, tags, capabilities, and context usage.\n\n## Message Lifecycle\n\nMessages pass through stable states:\n- `queued` — hub accepted, receiver not active yet\n- `running` — receiver stream handed the prompt\n- `complete` — response available\n- `error` — message failed\n- `expired` / `timeout` — TTL exceeded\n\n## Async vs Synchronous\n\n`council_send` is async by default — returns as soon as the hub accepts the message, terminates the follow-up LLM turn, and later delivers the reply back to the sender session. Use `synchronous=true` with `council_await` only when the user explicitly asks for blocking behavior.\n\n## Response Modes\n\n- `agent` (default) — sender agent handles the reply without the human answering for it\n- `notify` — human should read/respond\n- `none` — fire-and-forget\n\n## Security\n\n- Bearer token authenticates to the hub (`PI_COUNCIL_AUTH_TOKEN`)\n- Hub issues per-agent session secrets on registration\n- Session secret required for send, heartbeat, response, SSE, and delete operations\n- One token holder cannot perform lifecycle operations as another registered session\n\n## Mediator/Orchestrator Pattern\n\nA third Pi agent can act as mediator, using `council_list` to pick members by purpose/tags/capabilities, then `council_send` to ask each. The orchestrator's session memory becomes the mediator's working record (not a peer-shared blackboard).\n\n## Related Concepts\n\n- [Council Extension](../components/council-extension.md)\n- [Comms Deployment](../process/comms-deployment.md)\n- [Async Council Default](../decisions/async-council-default.md)\n- [System Architecture](./system-architecture.md)\n"},{"filepath":"architecture/fast-track-architecture.md","content":"---\ntype: Architecture\ntitle: Fast Track Pipeline Architecture\ndescription: The default lean pipeline mode — single model builds, stronger model evaluates, surgical fixes with watchdog timers, automated Playwright UAT.\nresource: ./extensions/dev-pipeline.ts\ntags: [pi-extensions, architecture, fast-track, build, evaluate, fix, uat, playwright]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Fast Track Pipeline Architecture\n\nActivated with `/pipeline-start` (no flags). A streamlined pipeline for faster iteration.\n\n## Pipeline Stages\n\n1. **BUILD** — A single model (Gemini 3 Pro) receives all tasks for the epic in one prompt. Builds from scratch for epic 1; extends existing code for subsequent epics.\n2. **EVALUATE** — A stronger model (Opus 4.6) reads the code and scores each task independently against acceptance criteria. Returns structured JSON with per-task scores and issues.\n3. **FIX** — Tasks below 95% get surgical fixes under watchdog timers. Each fix attempt runs with a timeout; if the agent can't finish, it's steered to yield a structured summary and an analyst decides how to proceed.\n4. **UAT SCENARIOS** — The evaluator generates test scenarios for the epic. Each scenario becomes a GitHub issue under a UAT parent epic.\n5. **UAT EXECUTION** — After all epics, Playwright runs all scenarios via browser, posts results to GitHub issues.\n6. **APPROVAL GATE** — Dashboard flashes \"AWAITING UAT APPROVAL\". User runs `/pipeline-approve` or `/pipeline-reject`.\n\n## Watchdog Timer Progression\n\n| Depth | Timeout | Model |\n|-------|---------|-------|\n| 1 | 10 min | Base fixer (Qwen 3.5+) |\n| 2 | 15 min | Escalation 1 (Sonnet 4.6) |\n| 3 | 20 min | Escalation 2 (Opus 4.6 xhigh) |\n| 4 | 25 min | Escalation 2 (clamped) |\n| 5 | 30 min | Escalation 2 (clamped) |\n\nAt T-30 seconds, the watchdog steers the agent to yield. At T, the agent is aborted and killed.\n\n## Stage Widget Bar\n\nA horizontal status bar shows real-time progress: `Build check | Eval dot | Fix circle | UAT Auto circle | UAT circle` with the active model and task name.\n\n## Auto-Chaining\n\nAfter each epic completes, the pipeline creates the next branch from current HEAD, resets tmux panes, pauses, and starts the next epic automatically. Halts if an epic fails after 5 fix depths.\n\n## Performance\n\nA 7-task epic with 2 fix depths typically takes 5-10 minutes. Full UAT across all epics adds 5-15 minutes.\n\n## Related Concepts\n\n- [Three-Wave Architecture](./three-wave-architecture.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n- [Fast Track vs Three-Wave](../decisions/fast-track-vs-three-wave.md)\n- [Fast Track Walkthrough](../process/fast-track-walkthrough.md)\n- [Sprint Development Workflow](../process/sprint-development-workflow.md)\n"},{"filepath":"architecture/github-integration.md","content":"---\ntype: Architecture\ntitle: GitHub Integration Layer\ndescription: Issue publishing from checklists, learnings as structured comments, issue body enrichment, and issue rebuild/recovery.\nresource: ./extensions/req-qa.ts\ntags: [pi-extensions, architecture, github, issues, learnings, enrichment, gh-cli]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# GitHub Integration Layer\n\nGitHub Issues serve as the durable state layer across both pipeline phases — acceptance criteria, learnings, UAT results, and approval all live on issues.\n\n## Issue Publishing (req-qa)\n\nAfter `generate_artifacts` runs, the extension:\n1. Parses the implementation checklist for epics and tasks\n2. Creates GitHub issues for each epic (as tracking issues)\n3. Creates GitHub issues for each task (linked to epic via `Part of #N` reference)\n4. Updates the checklist file with issue numbers (`- [ ] **1.1 — Title** [#42]`)\n5. Handles auth validation, repo creation (interactive), and error recovery\n\n`/req-rebuild-issues` can re-publish all issues if GitHub wasn't available during generation.\n\n## Issue Enrichment (dev-pipeline)\n\n`enrichTaskBodiesFromGitHub()` fetches full issue bodies via `gh issue view` so agents get complete acceptance criteria, not just checklist summaries. This runs at pipeline start.\n\n## Learnings as GitHub Comments\n\nWhen a fix agent yields or an analyst makes a decision, a structured comment is posted to the task's GitHub issue:\n\n```markdown\n## Agent Learning (depth 2, fix, claude-sonnet-4-6)\n**Yielded:** yes (timeout after 612s)\n**Blockers:** collision detection not triggering at maze boundaries\n**Attempted:** adjusted hitbox calculations; rewrote boundary detection\n**Suggestion:** try a tile-based grid collision approach\n**Analyst:** decompose — split into boundary detection + ghost collision\n```\n\nThese comments accumulate, forming a visible audit trail. On pipeline restart, learnings are automatically read back from the issue comments — nothing is lost.\n\n## UAT Issue Structure\n\n```\nUAT Epic #101: \"UAT Test Suite\"                     [uat]\n  +-- #102: \"UAT: Canvas renders correctly\"          [uat-pass, epic-1]\n  +-- #103: \"UAT: Game loop 60 FPS\"                  [uat-fail, epic-4]\n```\n\nLabels: `uat`, `uat-pending`, `uat-pass`, `uat-fail`, `epic-N`. UAT epic closed only when user runs `/pipeline-approve`.\n\n## Blueprint Issue Rebuild\n\n`/blueprint-rebuild-issues` recovers or rebuilds GitHub issues from artifacts, providing a recovery path when issues are lost or out of sync.\n\n## Related Concepts\n\n- [System Architecture](./system-architecture.md)\n- [Req-QA Extension](../components/req-qa-extension.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n- [Requirements Discovery Workflow](../process/requirements-discovery-workflow.md)\n"},{"filepath":"architecture/model-configuration.md","content":"---\ntype: Architecture\ntitle: Model Configuration System\ndescription: Per-role model assignments, fix escalation chain, thinking level cycling, model selector with ping test, and runtime config persistence.\nresource: ./extensions/dev-pipeline.ts\ntags: [pi-extensions, architecture, models, configuration, escalation, ping-test, thinking]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Model Configuration System\n\nThe `/pipeline-config` command opens a full-screen configuration view with two mode tabs (Fast Track and 3-Wave) listing every pipeline role, its assigned model, and reasoning level.\n\n## Configuration UI\n\nEach role shows its model and thinking level (e.g. `gemini-3-pro | high`). Controls:\n- **Enter** — open model selector to change the model\n- **Space** — cycle thinking level: `off -> minimal -> low -> medium -> high -> xhigh`\n- **Del/Backspace** — remove an escalation step\n- **Tab** — switch between Fast Track and 3-Wave tabs\n\n## Model Selector\n\nOn Enter, a model selector opens with two tabs:\n- **Available** — only models with configured API keys (ready to use)\n- **All** — every registered model (including unconfigured ones)\n\nSelecting a model triggers a quick ping test to confirm it responds. On success, the assignment is saved to `~/.pi/agent/pipeline-config.json` and takes effect immediately — no restart needed.\n\n## Fix Escalation\n\nWhen a task fails at depth 1, the pipeline escalates to the next configured model/thinking pair:\n- Depth 1 uses the base Fixer\n- Depth 2 uses Escalation 1\n- Depth 3 uses Escalation 2\n- Add as many escalation steps as needed (Enter on \"+ Add escalation step\")\n- If depths exceed configured escalation steps, the last step is reused\n\n## Fast Track Default Assignments\n\n| Role | Model |\n|------|-------|\n| Builder | Gemini 3 Pro Preview |\n| Evaluator | Claude Opus 4.6 |\n| Fixer | Qwen 3.5 Plus |\n| Fix Escalation 1 | Claude Sonnet 4.6 |\n| Fix Escalation 2 | Claude Opus 4.6 (xhigh) |\n| Analyst | Claude Opus 4.6 (xhigh) |\n| UAT Tester | Gemini 3 Pro Preview |\n\n## 3-Wave Default Assignments\n\n| Role | Model |\n|------|-------|\n| Council Architects | Opus, Qwen 3.5+, Gemini 3 Pro |\n| Prototype Step 1 | Gemini 3 Pro Preview |\n| Prototype Step 2 | Claude Haiku 4.5 |\n| Prototype Step 3 | Qwen 3.5 Plus |\n| Dev Agent | Claude Haiku 4.5 |\n| Compliance | Qwen 3.5 Plus |\n| Orchestrator Override | Claude Opus 4.6 |\n\nThe Analyst role uses the strongest model by default because it needs to deeply understand failure patterns and make architectural decisions about task decomposition.\n\n## Related Concepts\n\n- [Fast Track Architecture](./fast-track-architecture.md)\n- [Three-Wave Architecture](./three-wave-architecture.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n- [Pipeline Agents](../domain/pipeline-agents.md)\n"},{"filepath":"architecture/pipeline-state-system.md","content":"---\ntype: Architecture\ntitle: Pipeline State System\ndescription: The pipeline-state.json file, terminal and web dashboards, observer mode, and TCP control socket for agent steering.\nresource: ./extensions/dev-pipeline.ts\ntags: [pi-extensions, architecture, state, dashboard, observer-mode, control-socket, sse]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Pipeline State System\n\nThe dev-pipeline extension writes state to `.pi/pipeline-logs/pipeline-state.json` on every state change. This state file drives the terminal dashboard, web dashboard, and observer mode.\n\n## State File Structure\n\nThe JSON includes:\n- `ts` — timestamp\n- `running` — whether pipeline is active\n- `branch` — current git branch\n- `currentPhase` — index of active epic\n- `phases` — array of epic objects with name, task lists, scores, attempts, yields, analyst actions\n- `log` — recent activity log entries (color-coded)\n- `activeAgent` — name, model, and hint of the currently running agent\n\nEach task entry includes: id, title, status (passed/building/scoring/failed/pending), complianceScore, attempts, yields, and lastAnalystAction.\n\n## Observer Mode\n\nWhen a second `pi-dev` terminal is opened while a pipeline is already running:\n- The widget polls `pipeline-state.json` every 3 seconds\n- All mutating commands are blocked (`/pipeline-start`, `/pipeline-next`, `/pipeline-reset`, `/pipeline-approve`, `/pipeline-reject`, `/pipeline-end`)\n- Read-only commands still work\n- Automatically exits observer mode when the running pipeline finishes\n\n## TCP Control Socket (port 3142)\n\nProgrammatic interface for agent registration and command forwarding:\n- Extension registers agents on spawn: `{\"type\":\"register\",\"agentId\":\"...\",...}`\n- Web UI POSTs steer commands; socket forwards to the extension\n- Extension writes commands to the agent's `proc.stdin`\n- Extension auto-connects on startup and re-registers on reconnect\n\nIf the web dashboard isn't running, steering still works via watchdog timers directly through stdin.\n\n## Checkpoint System\n\nSave/resume support for long-running pipelines. State can be reconstructed from GitHub issue comments on restart — learnings survive crashes.\n\n## Related Concepts\n\n- [Agent Subprocess Execution](./agent-subprocess-execution.md)\n- [Pipeline Dashboard](../components/pipeline-dashboard.md)\n- [Pipeline Dashboard Web](../components/pipeline-dashboard-web.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n"},{"filepath":"architecture/system-architecture.md","content":"---\ntype: Architecture\ntitle: Two-Phase Pipeline System Architecture\ndescription: Overall system design built on two extension pipelines — req-qa for requirements discovery and dev-pipeline for sprint development.\nresource: ./README.md\ntags: [pi-extensions, architecture, pipeline, req-qa, dev-pipeline, sdlc]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Two-Phase Pipeline System Architecture\n\nThe pi-extensions system is built on two main extension pipelines that form a complete software development lifecycle.\n\n## Phase 1 — Requirements Discovery (`req-qa`)\n\nThe pi session acts as an interviewer, calling specialist agents on demand, with everything gated by user approval:\n\n1. Human interview loop — one question at a time\n2. Specialist consultations — sequential, spawned as pi subprocesses\n3. User review and refinement — iterate until satisfied\n4. Sign-off — generate PRD + implementation checklist\n5. Publish to GitHub Issues — epics and tasks linked\n\n## Phase 2 — Sprint Development (`dev-pipeline`)\n\nReads the checklist produced by req-qa and drives tasks through development, compliance, and quality gates. Two execution modes:\n\n- **Fast Track (default)** — Build entire epic, evaluate per-task, surgical fixes with watchdog timers, automated UAT via Playwright.\n- **3-Wave (`--multiwave`)** — Council architecture, 3-step prototype build, sequential dev sprint with compliance scoring.\n\nBoth modes auto-chain through all epics, halt on failure, and require explicit UAT approval before squash merge.\n\n## Key Design Principles\n\n- The checklist is the contract between the two phases — req-qa produces it, dev-pipeline consumes it.\n- GitHub Issues are the durable state layer — acceptance criteria, learnings, UAT results, and approval all live on issues.\n- Agents are spawned as pi CLI subprocesses in RPC mode, enabling mid-execution steering.\n- Only `dev` and `prd-writer` agents have write access; all others are read-only.\n\n## Related Concepts\n\n- [Agent Subprocess Execution](./agent-subprocess-execution.md)\n- [Fast Track Architecture](./fast-track-architecture.md)\n- [Three-Wave Architecture](./three-wave-architecture.md)\n- [GitHub Integration](./github-integration.md)\n- [Requirements Discovery Workflow](../process/requirements-discovery-workflow.md)\n- [Sprint Development Workflow](../process/sprint-development-workflow.md)\n"},{"filepath":"architecture/three-wave-architecture.md","content":"---\ntype: Architecture\ntitle: Three-Wave Pipeline Architecture\ndescription: The thorough multi-wave pipeline mode — council architecture, 3-step prototype build, sequential dev sprint with compliance scoring.\nresource: ./extensions/dev-pipeline.ts\ntags: [pi-extensions, architecture, three-wave, multiwave, council, prototype, compliance]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Three-Wave Pipeline Architecture\n\nActivated with `/pipeline-start --multiwave`. Best for complex projects requiring maximum quality. Uses multiple models in council for architecture, a 3-step prototype build, and detailed review passes.\n\n## Wave Structure\n\n### Wave 1 — Foundations Council\nThree architects (Opus, Qwen 3.5+, Gemini 3 Pro) run in parallel, each producing an independent design brief. The extension consolidates them into a unified spec.\n\n### Wave 0 — Prototype (first epic only)\nA 3-step sequential prototype build:\n1. **Gemini 3 Pro** — full one-shot build from spec\n2. **Claude Haiku 4.5** — enhancement and polish pass\n3. **Qwen 3.5 Plus** — fine-tuning and refinement pass\n\nWave 0 runs only for the first epic. Subsequent epics skip it to avoid destroying previous work.\n\n### Wave 1 — Review + TODO Placement\nA reviewer reviews the prototype vs the spec and places TODOs in the code.\n\n### Wave 2 — Sequential Dev Sprint\nFor each task: dev agent implements (sees TODOs + spec), compliance agent scores. If score < 95%, the dev agent fixes gaps (up to 5 retries). All operations run sequentially — no parallel worktrees, preventing merge conflicts.\n\n## Key Design Decisions\n\n- **Wave 0 runs only for the first epic** — subsequent epics skip it to avoid destroying previous work\n- **All Wave 2 operations run sequentially** — no parallel worktrees, preventing merge conflicts on single-file projects\n- **Orchestrator override** — when a task scores 90-94%, Opus reviews the deductions and overrides if they're pedantic\n- **GitHub issue enrichment** — fetches full issue bodies via `gh issue view` so agents get complete acceptance criteria\n- **Auto-chaining** — epics chain automatically with 5s pause between them, halting on failure\n\n## Model Assignments\n\n| Role | Model |\n|------|-------|\n| Council Architects | Opus, Qwen 3.5+, Gemini 3 Pro |\n| Prototype Step 1 | Gemini 3 Pro Preview |\n| Prototype Step 2 | Claude Haiku 4.5 |\n| Prototype Step 3 | Qwen 3.5 Plus |\n| Dev Agent | Claude Haiku 4.5 |\n| Compliance | Qwen 3.5 Plus |\n| Orchestrator Override | Claude Opus 4.6 |\n\n## Performance\n\nA 7-task epic with fix attempts typically takes 15-25 minutes. 15-30+ LLM calls per epic.\n\n## Related Concepts\n\n- [Fast Track Architecture](./fast-track-architecture.md)\n- [Fast Track vs Three-Wave](../decisions/fast-track-vs-three-wave.md)\n- [Pipeline Agents](../domain/pipeline-agents.md)\n- [Model Configuration](./model-configuration.md)\n"},{"filepath":"components/council-extension.md","content":"---\ntype: Component\ntitle: council Extension\ndescription: Networked Pi-to-Pi council client over a Bun HTTP/SSE hub with member discovery, async request/response, and offline mailbox.\nresource: ./extensions/council.ts\ntags: [pi-extensions, component, council, networked, hub, async, discovery]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# council Extension\n\n**File:** `extensions/council.ts`\n**Server:** `scripts/council-server.ts`\n**Package:** `@holovkat/pi-council` via `npm run build` -> `dist/council-package`\n\nA networked request/response council for multiple Pi agents. Drop-in successor to `coms.ts` whose substrate is a dedicated Bun HTTP/SSE hub. Both can be loaded together without identifier collision.\n\n## Tools\n\n| Tool | Purpose |\n|------|---------|\n| `council_list` | List available council members with name, model, purpose, status, tags, capabilities, context usage |\n| `council_send` | Ask/assign work to a selected council member by exact name. Async by default |\n| `council_get` | Non-blocking poll for a known `msg_id` |\n| `council_await` | Blocking wait, only for sends created with `synchronous=true` |\n\n## Slash Commands\n\n| Command | Purpose |\n|---------|---------|\n| `/council` | Refresh the council panel |\n| `/council --server` | Show hub URL, PID, queue/status counts, recent events |\n| `/council --reconnect` | Re-register and reopen the event stream |\n| `/council --project <name>` | View another project/council pool |\n\n## Quick Start\n\n```bash\npi --no-extensions -e ./extensions/council.ts --name net-alice --project council-uat --tags planner\npi --no-extensions -e ./extensions/council.ts --name net-bob --project council-uat --tags implementer\n```\n\nThe first agent auto-starts a localhost hub on port 48201. Use `council_list` first, then `council_send` with the exact member name.\n\n## Defaults\n\n- `council_send` is async by default\n- Default `response_mode=\"agent\"` lets the sender agent handle replies without the human\n- Environment variables: `PI_COUNCIL_*` for host, port, project, auth token, limits, autostart\n\n## Related Concepts\n\n- [Council Architecture](../architecture/council-architecture.md)\n- [Comms Deployment](../process/comms-deployment.md)\n- [Async Council Default](../decisions/async-council-default.md)\n"},{"filepath":"components/dev-pipeline-extension.md","content":"---\ntype: Component\ntitle: dev-pipeline Extension\ndescription: Command-driven sprint development lifecycle extension with Fast Track and 3-Wave modes, compliance scoring, watchdog timers, and automated UAT.\nresource: ./extensions/dev-pipeline.ts\ntags: [pi-extensions, component, dev-pipeline, sprint, fast-track, three-wave, compliance, uat]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# dev-pipeline Extension\n\n**File:** `extensions/dev-pipeline.ts` (~3630 lines)\n**Alias:** `pi-dev`\n**Theme:** midnight-ocean\n\nA command-driven sprint development lifecycle with two execution modes. Both read the checklist produced by req-qa and drive tasks through development, compliance, and quality gates.\n\n## Dual-Mode Architecture\n\n- **Fast Track (default)** — `/pipeline-start`: single model builds, stronger model evaluates, surgical fixes with watchdog timers, automated Playwright UAT.\n- **3-Wave** — `/pipeline-start --multiwave`: council architecture, 3-step prototype build, sequential dev sprint with compliance scoring.\n\n## Shared Infrastructure\n\nBoth modes share:\n- Checklist parser (handles both `### Phase N:` and `## Epic N:` headers, multiple task formats)\n- GitHub issue enrichment (`gh issue view` for full acceptance criteria)\n- GitHub issue learnings (structured comments, read back on restart)\n- RPC agent steering (stdin piped, mid-execution steering)\n- Watchdog timers (per-depth timeout with steer-for-summary)\n- Auto-chaining (epics chain automatically with branch creation)\n- Tmux log panes (live agent output, auto-closing)\n- Pipeline state file (`pipeline-state.json` for dashboard)\n- Branch management (each epic gets its own branch)\n- Checkpoint system (save/resume for long-running pipelines)\n- Configurable models (`/pipeline-config`)\n\n## Commands\n\n| Command | Description |\n|---------|-------------|\n| `/pipeline-start` | Initialize pipeline in Fast Track mode (default) |\n| `/pipeline-start --multiwave` | Initialize pipeline in 3-Wave mode |\n| `/pipeline-next` | Run next phase (uses active mode) |\n| `/pipeline-approve` | Approve UAT results (Fast Track) |\n| `/pipeline-reject` | Reject UAT with notes, loop back (Fast Track) |\n| `/pipeline-reset` | Full reset — checkout main, delete branches, uncheck, reopen |\n| `/pipeline-end` | UAT sign-off, squash merge to main, push, clean up |\n| `/pipeline-config` | Configure model assignments for each role |\n| `/pipeline-status` | Show current pipeline progress |\n| `/pipeline-dashboard` | Open live dashboard in tmux pane |\n| `/pipeline-logs` | Open all agent logs in tmux panes |\n| `/pipeline-watch <name>` | Tail a specific agent's log |\n| `/pipeline-close-panes` | Close all tmux/dashboard panes |\n\n## Related Concepts\n\n- [Fast Track Architecture](../architecture/fast-track-architecture.md)\n- [Three-Wave Architecture](../architecture/three-wave-architecture.md)\n- [Pipeline State System](../architecture/pipeline-state-system.md)\n- [Model Configuration](../architecture/model-configuration.md)\n- [Sprint Development Workflow](../process/sprint-development-workflow.md)\n"},{"filepath":"components/okf-extension.md","content":"---\ntype: Component\ntitle: OKF Pi Extension\ndescription: Open Knowledge Format extension providing /okf-status, /okf-query, /okf-capture, /okf-curate, and /okf-init commands for project knowledge management.\nresource: ./extensions/okf.ts\ntags: [pi-extensions, component, okf, knowledge, curation, inbox]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# OKF Pi Extension\n\n**File:** `extensions/okf.ts`\n\nProvides commands for interacting with a project's `knowledge/` OKF bundle. The bundle structure is defined in the OKF-STANDARD.md (v0.1).\n\n## Commands\n\n| Command | Description |\n|---------|-------------|\n| `/okf-status` | Show inbox count, concept counts, last curation |\n| `/okf-query <search>` | Search concepts by title, tags, or description |\n| `/okf-capture` | Write a session synthesis to `knowledge/inbox/` |\n| `/okf-curate` | Trigger curation of inbox items into permanent concepts |\n| `/okf-init` | Initialize a new knowledge bundle in the current project |\n\n## Concept Types\n\nThe extension recognizes seven concept types: Architecture, Component, Domain, Decision, Process, Deprecation, State, plus Inbox.\n\n## How It Works\n\n- Resolves the `knowledge/` directory relative to the project cwd\n- Parses YAML frontmatter from concept files\n- Counts concepts per directory for status display\n- Searches across titles, tags, and descriptions for query\n- Writes structured inbox items for capture\n- The curation is performed by the OKF Curator droid\n\n## Related Concepts\n\n- [OKF Curator Droid](../domain/okf-curator-droid.md)\n- [Current Repo State](../state/current-repo-state.md)\n"},{"filepath":"components/pi-blueprint-extension.md","content":"---\ntype: Component\ntitle: pi-blueprint Extension\ndescription: GitHub-backed interactive planning cockpit with transcript-backed consultations, PRD/checklist generation, alignment scoring, and asset sync.\nresource: ./extensions/pi-blueprint.ts\ntags: [pi-extensions, component, pi-blueprint, planning, github, alignment, assets]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# pi-blueprint Extension\n\n**File:** `extensions/pi-blueprint.ts`\n**Usage:** `pi -ne -e extensions/pi-blueprint.ts -e extensions/theme-cycler.ts`\n\nGitHub-backed planning workflow that adds transcript-backed specialist consultations, PRD/checklist generation, alignment scoring, issue rebuild/recovery, and repo-managed asset sync.\n\n## Repo-Managed Assets\n\n- `agents/pi-blueprint/` — planning agents committed with the repo\n- `skills/pi-blueprint/` — planning skills committed with the repo\n- `bin/blueprint-dashboard-web` — live Blueprint web mirror\n\nUse `/blueprint-sync-assets` to mirror repo-managed assets into a project-local `.pi` runtime.\n\n## Commands\n\n| Command | Description |\n|---------|-------------|\n| `/blueprint-status` | Show current planning phase and readiness |\n| `/blueprint-history` | Show consultation history |\n| `/blueprint-prd` | Open the generated PRD |\n| `/blueprint-checklist` | Open the generated checklist |\n| `/blueprint-web` | Open the live Blueprint web mirror |\n| `/blueprint-sync-assets` | Sync repo-managed agents and skills into local `.pi` |\n| `/blueprint-check-alignment` | Verify transcript-backed alignment |\n| `/blueprint-rebuild-issues` | Rebuild or recover GitHub issues |\n\n## Key Capabilities\n\n- Transcript search over consultation history\n- Alignment checks validating transcript-backed decisions\n- Issue rebuilds for recovery when GitHub issues are lost\n- Asset sync from repo to local runtime\n- Dedicated web mirror for browser-based planning\n\n## Related Concepts\n\n- [System Architecture](../architecture/system-architecture.md)\n- [Pi-Toolshed Extension](./pi-toolshed-extension.md)\n- [Requirements Discovery Workflow](../process/requirements-discovery-workflow.md)\n- [GitHub Integration](../architecture/github-integration.md)\n"},{"filepath":"components/pi-toolshed-extension.md","content":"---\ntype: Component\ntitle: pi-toolshed Extension\ndescription: Interactive card/workspace shell for frontier packets, quick actions, workspace presets, and blueprint-aware planning handoffs.\nresource: ./extensions/pi-toolshed.ts\ntags: [pi-extensions, component, pi-toolshed, workspace, cards, frontier, packets, mcp]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# pi-toolshed Extension\n\n**File:** `extensions/pi-toolshed.ts`\n\nInteractive card/workspace shell for frontier packets, quick actions, workspace presets, and blueprint-aware planning handoffs. Built around the FMS-GLM conversation-lane model: one centered lane, floating header, bottom composer, single active frontier, freeze/inject progression.\n\n## Repo Surfaces\n\n- `bin/toolshed-dashboard-web` — browser UI for the toolshed workspace\n- `PRD-PI-TOOLSHED.md` — product direction\n- `TOOLSHED-IMPLEMENTATION-INSTRUCTIONS.md` — implementation notes\n\n## Lane Discipline\n\n- One centered conversation lane is the source of truth\n- Only one active frontier at a time\n- Freeze resolved work into packets or summaries before branching\n- Widgets support the lane; they do not replace it\n\n## Workspace Presets\n\n10 workspace presets with 30 unique widgets total: Toolshed Core, RFC Studio, MCP Lab, Pair Programmer, Mission Control, Research Desk, Incident Ops, Design Review, Release Center, Automation Workbench.\n\n## Widget Placements\n\n`inline`, `left-dock`, `right-dock`, `float`. Widgets can pin, collapse, detach, and remember size/placement.\n\n## Commands\n\n| Command | Description |\n|---------|-------------|\n| `/toolshed-web` | Open the toolshed web workspace |\n| `/toolshed-status` | Show current toolshed state |\n| `/toolshed-workspace` | Switch active workspace preset |\n| `/toolshed-freeze` | Freeze the active frontier into a packet |\n| `/toolshed-packets` | Inspect the packet queue |\n| `/toolshed-reset-layout` | Reset card collapse state |\n\n## MCP App Hosting\n\nToolshed owns the MCP hosting path for custom apps (calculator, GitHub kanban board). Apps are exposed through PI-managed MCP routes and externally via ngrok.\n\n## Related Concepts\n\n- [Pi-Blueprint Extension](./pi-blueprint-extension.md)\n- [Toolshed Implementation](../process/toolshed-implementation.md)\n- [Current Repo State](../state/current-repo-state.md)\n"},{"filepath":"components/pipeline-dashboard-web.md","content":"---\ntype: Component\ntitle: Pipeline Control Center (Web)\ndescription: Multi-page web application for monitoring and steering agents from a browser — SSE dashboard, interactive steer UI, and TCP control socket.\nresource: ./bin/pipeline-dashboard-web\ntags: [pi-extensions, component, web, dashboard, steer, sse, control-socket, browser]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Pipeline Control Center (Web)\n\n**File:** `bin/pipeline-dashboard-web`\n**Alias:** `pi-web`\n**Port:** 3141 (web), 3142 (TCP control socket)\n\nA multi-page web application for monitoring and steering agents from a browser.\n\n## Pages\n\n### Home (`/`)\nNavigation cards linking to Dashboard and Steer pages.\n\n### Dashboard (`/dashboard`)\nLive SSE-powered view of pipeline state — same data as the terminal dashboard but rendered in HTML with the Claude/shadcn oklch theme. Supports dark/light toggle.\n\n### Steer (`/steer`)\nInteractive agent steering page:\n- Active agent list (auto-refreshes every 3s)\n- Message textarea with Steer / Follow-up / Abort buttons\n- Live steer log via SSE showing command history\n\n## Steering Flow\n\n1. Browser POSTs to `/api/steer` with agent ID and message\n2. Web server forwards over TCP control socket (port 3142) to `dev-pipeline.ts`\n3. Extension writes the command as JSON to the agent's `proc.stdin` (pi RPC mode)\n4. Pi interrupts the agent mid-execution and delivers the message\n5. Agent responds to the steer before continuing\n\n## Use Cases\n\n- Tell a stuck builder to \"focus only on the collision logic\"\n- Ask a fixer to \"try a completely different approach\"\n- Abort a runaway agent that's rewriting the entire file\n\n## TCP Control Socket (port 3142)\n\nProgrammatic interface for agent registration and command forwarding. The extension auto-connects on startup and re-registers agents on reconnect. If the web dashboard isn't running, steering still works via watchdog timers.\n\n## Related Concepts\n\n- [Pipeline State System](../architecture/pipeline-state-system.md)\n- [Agent Subprocess Execution](../architecture/agent-subprocess-execution.md)\n- [Pipeline Terminal Dashboard](./pipeline-dashboard.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n"},{"filepath":"components/pipeline-dashboard.md","content":"---\ntype: Component\ntitle: Pipeline Terminal Dashboard\ndescription: Standalone bash script that reads pipeline-state.json every 2 seconds and renders a live terminal dashboard with spinners, color-coded status, and UAT approval alerts.\nresource: ./bin/pipeline-dashboard\ntags: [pi-extensions, component, dashboard, terminal, bash, live, pipeline-state]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Pipeline Terminal Dashboard\n\n**File:** `bin/pipeline-dashboard`\n**Alias:** `pi-dash`\n\nA standalone bash script that reads `pipeline-state.json` every 2 seconds and renders a live terminal dashboard.\n\n## Features\n\n- Animated spinners for active work\n- Color-coded task status: green=passed, blue=building, cyan=scoring, red=failed, dim=pending\n- Compliance scores with color thresholds (green >= 95%, yellow >= 80%, red < 80%)\n- Phase elapsed time\n- Recent activity log (last 12 entries, color-coded)\n- Live tail of the active agent's log output\n- UAT approval status (yellow flashing when awaiting)\n\n## Usage\n\n```bash\npi-dash /path/to/project      # standalone\n/pipeline-dashboard           # from inside pi (opens in tmux pane)\n```\n\n## Dashboard Output Example\n\n```\nOK Epic 1: Foundation & Core Architecture\nOK Epic 2: Procedural Maze Generation\nOK Epic 3: Player Mechanics\nDOT Epic 4: Ghost AI [fast-eval]\n  OK 4.1: Ghost entity class  98%\n  DOT 4.2: A* pathfinding  evaluating\n  CIRCLE 4.3: Targeting behaviors\n\nWARNING AWAITING UAT APPROVAL — /pipeline-approve or /pipeline-reject\n  UAT: 12 pass, 2 fail, 1 pending\n\nMode: Fast Track\n```\n\n## Related Concepts\n\n- [Pipeline State System](../architecture/pipeline-state-system.md)\n- [Pipeline Dashboard Web](./pipeline-dashboard-web.md)\n- [Dev-Pipeline Extension](./dev-pipeline-extension.md)\n"},{"filepath":"components/req-qa-extension.md","content":"---\ntype: Component\ntitle: req-qa Extension\ndescription: Interactive human-in-the-loop requirements discovery extension with specialist consultations, session persistence, and GitHub issue publishing.\nresource: ./extensions/req-qa.ts\ntags: [pi-extensions, component, req-qa, requirements, interview, specialist, prd]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# req-qa Extension\n\n**File:** `extensions/req-qa.ts` (~1640 lines)\n**Alias:** `pi-req`\n**Theme:** rose-pine\n\nAn interactive, human-in-the-loop requirements discovery system. The pi session acts as an interviewer, calling specialist agents on demand, with everything gated by user approval.\n\n## State Machine\n\n`idle -> interview -> consulting -> interview -> review -> interview|finalizing -> done`\n\n- **Auto-detect on startup:** Has consultation history -> resume; Has existing PRD -> enhance; Neither -> fresh start.\n\n## Tools\n\n| Tool | Purpose | Subprocess? |\n|------|---------|-------------|\n| `consult_specialist` | Call a specialist agent for focused analysis | Yes — spawns agent subprocess |\n| `generate_artifacts` | Produce PRD + checklist after user sign-off | Yes — spawns prd-writer |\n\n## Consultation Modes\n\n- **Fast mode** (`deep: false`, default): Specialist gets NO file tools — pure prompt-based analysis. ~15s per call.\n- **Deep mode** (`deep: true`): Specialist gets file-reading tools + session persistence. Can examine the actual codebase. ~30-60s per call.\n\n## Session Persistence\n\nState is saved to `req-qa-state.json` after every consultation and phase change. The `before_agent_start` hook dynamically injects consultation history and PRD content into the orchestrator's system prompt.\n\n## GitHub Integration\n\nAfter `generate_artifacts`: parses checklist for epics/tasks, creates GitHub issues for each (linked via `Part of #N`), updates checklist with issue numbers. `/req-rebuild-issues` re-publishes if GitHub wasn't available.\n\n## Commands\n\n| Command | Description |\n|---------|-------------|\n| `/req-status` | Show current phase and consultation count |\n| `/req-history` | Show all specialist consultations |\n| `/req-logs` | Open all specialist logs in tmux panes |\n| `/req-watch <name>` | Tail a specific specialist's log |\n| `/req-close-panes` | Close all tmux log panes |\n| `/req-prd` | View PRD in glow (rendered markdown) |\n| `/req-rebuild-issues` | Re-publish all GitHub issues from checklist |\n| `/req-reset` | Clear session state and start fresh |\n\n## Related Concepts\n\n- [System Architecture](../architecture/system-architecture.md)\n- [Specialist Agents](../domain/specialist-agents.md)\n- [GitHub Integration](../architecture/github-integration.md)\n- [Requirements Discovery Workflow](../process/requirements-discovery-workflow.md)\n"},{"filepath":"decisions/async-council-default.md","content":"---\ntype: Decision\ntitle: Async Council Send by Default\ndescription: Decision that council_send is async by default, with synchronous=true reserved for explicit blocking/chained behavior.\nresource: ./docs/comms.md\ntags: [pi-extensions, decision, council, async, synchronous, response-mode]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Decision: Async Council Send by Default\n\n## Context\n\nThe council extension needs a default communication pattern between Pi agents. The choice between async and synchronous affects how agents coordinate and whether they block.\n\n## Decision\n\n`council_send` is async by default. The sender should not call `council_await` unless the user explicitly asks for synchronous/blocking/chained behavior.\n\n## How It Works\n\n- Async send returns as soon as the hub accepts or queues the message\n- Terminates the follow-up LLM turn\n- Later delivers `[council response from <member>]` back to the sender session when the member replies\n- Default `response_mode=\"agent\"` lets the sender agent handle the reply without the human answering for it\n- If a model mistakenly calls `council_await` for an async send, the await returns immediately with guidance instead of blocking\n\n## Response Modes\n\n- `agent` (default) — sender agent handles the reply autonomously\n- `notify` — human should read/respond\n- `none` — fire-and-forget\n\n## Rationale\n\n- **Non-blocking** — agents can continue working while waiting for responses\n- **Offline mailbox** — Alice can continue after seeing `queued`; Bob's response is relayed when he reconnects\n- **Agent autonomy** — default `response_mode=\"agent\"` means the human doesn't need to answer for the agent\n- **Simplicity** — async is the common case; synchronous is the exception that requires opt-in\n\n## Alternatives Rejected\n\n- **Synchronous by default** — would block agents unnecessarily and complicate orchestrator workflows\n- **Always synchronous with timeout** — adds complexity without benefit for the common case\n\n## Related Concepts\n\n- [Council Architecture](../architecture/council-architecture.md)\n- [Council Extension](../components/council-extension.md)\n- [Comms Deployment](../process/comms-deployment.md)\n"},{"filepath":"decisions/diffusion-research-basis.md","content":"---\ntype: Decision\ntitle: Diffusion Research Basis\ndescription: Research context behind the pipeline design — diffusion LLM principles (parallel denoising, progressive refinement, bidirectional context) applied to multi-pass code generation.\nresource: ./docs/research-diffusion-llm-code-generation.md\ntags: [pi-extensions, decision, research, diffusion, llm, multi-pass, code-generation, architecture]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Diffusion Research Basis\n\n## Context\n\nThe 3-Wave pipeline architecture was informed by research into diffusion LLMs and their application to multi-pass code generation.\n\n## Diffusion Analogy to Code Generation\n\n| Diffusion Concept | Code Generation Equivalent |\n|---|---|\n| t=1.0 (full noise) | Empty scaffold / specification only |\n| t=0.7 (high noise) | Structural skeleton: signatures, imports, types |\n| t=0.4 (medium noise) | Core implementation: function bodies, logic |\n| t=0.2 (low noise) | Edge cases, error handling, validation |\n| t=0.0 (clean) | Production-ready code with formatting, tests |\n\n## Key Principles Adopted\n\n1. **Progressive refinement** — each pass refines from a coarser to finer state (spec -> scaffold -> implementation -> edge cases -> polish)\n2. **Bidirectional context** — each pass has access to the full context of all other files at their current refinement level (the Implementer sees all signatures, not just the file it's working on)\n3. **Revisability** — if a later pass reveals structural insufficiency, earlier passes can be re-run (re-scaffolding) without regenerating everything\n4. **Quality-compute trade-off** — more passes = higher quality, fewer passes = faster (mirrors step-count trade-off in diffusion sampling)\n\n## 3-Wave Mapping\n\n- **Wave 1 (Council)** = Pass 0 (Specification Ingestion) + Pass 1 (Structural Scaffolding)\n- **Wave 0 (Prototype)** = Pass 2 (Core Implementation)\n- **Wave 1 (Review + TODOs)** = Pass 3 (Refinement)\n- **Wave 2 (Dev Sprint)** = Pass 4 (Polish & Verification) with compliance scoring\n\n## Failure Modes Noted\n\n- **Pass boundary incoherence** — mitigated by each pass receiving full output of all previous passes\n- **Scaffolding lock-in** — mitigated by allowing re-scaffolding triggers when structural insufficiency is detected\n- **Over-refinement/oscillation** — mitigated by monotonically increasing confidence thresholds\n\n## Key References\n\nMDLM (NeurIPS 2024), SEDD (ICML 2024 Best Paper), LLaDA (NeurIPS 2025), Block Diffusion (ICLR 2025), DiffuCoder (Apple 2025), Mercury 2 (Inception Labs).\n\n## Related Concepts\n\n- [Three-Wave Architecture](../architecture/three-wave-architecture.md)\n- [Fast Track vs Three-Wave](./fast-track-vs-three-wave.md)\n- [System Architecture](../architecture/system-architecture.md)\n"},{"filepath":"decisions/fast-track-vs-three-wave.md","content":"---\ntype: Decision\ntitle: Fast Track vs Three-Wave\ndescription: Decision to offer two pipeline modes — lean Fast Track for iteration speed and thorough 3-Wave for maximum quality on complex projects.\nresource: ./README.md\ntags: [pi-extensions, decision, fast-track, three-wave, multiwave, trade-offs]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Decision: Fast Track vs Three-Wave\n\n## Context\n\nThe dev-pipeline extension needs to serve both fast iteration cycles and complex architectural builds. A single mode would either be too slow for simple projects or too shallow for complex ones.\n\n## Decision\n\nOffer two execution modes:\n\n- **Fast Track (default)** — activated with `/pipeline-start` (no flags)\n- **3-Wave** — activated with `/pipeline-start --multiwave`\n\n## Trade-offs\n\n| | 3-Wave | Fast Track |\n|---|---|---|\n| **LLM calls per epic** | 15-30+ | 3-8 |\n| **Time per epic** | 15-25 min | 5-10 min |\n| **Quality approach** | Multi-model consensus | Single builder + strong evaluator |\n| **Fix strategy** | Re-attempt with gap feedback | Surgical subtask decomposition |\n| **UAT** | Manual sign-off | Automated Playwright + approval gate |\n| **Best for** | Complex architectures, first builds | Iteration, known patterns, speed |\n\n## Rationale\n\n- Fast Track optimizes for speed and iteration: one model builds, one evaluates, surgical fixes with watchdog timers. Best for known patterns and rapid delivery.\n- 3-Wave optimizes for quality: council of 3 models designs architecture, 3-step prototype build, sequential dev with compliance scoring. Best for complex projects and first builds.\n- Users can switch modes between epics — use Fast Track for early epics, switch to 3-Wave for complex ones.\n\n## Alternatives Rejected\n\n- **Single mode only** — would force a quality/speed trade-off on every project\n- **Automatic mode selection** — rejected because the user knows their project complexity better than heuristics\n\n## Related Concepts\n\n- [Fast Track Architecture](../architecture/fast-track-architecture.md)\n- [Three-Wave Architecture](../architecture/three-wave-architecture.md)\n- [Model Configuration](../architecture/model-configuration.md)\n- [Sprint Development Workflow](../process/sprint-development-workflow.md)\n"},{"filepath":"decisions/read-only-agents-by-design.md","content":"---\ntype: Decision\ntitle: Read-Only Agents by Design\ndescription: Decision that only dev and prd-writer have write access; all other agents are read-only to prevent evaluation agents from silently modifying code.\nresource: ./README.md\ntags: [pi-extensions, decision, agents, read-only, write-access, safety, compliance]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Decision: Read-Only Agents by Design\n\n## Context\n\nThe pipeline spawns multiple agents for building, evaluating, reviewing, testing, and scoring. If evaluation or compliance agents could modify code, they might silently change implementations during scoring, corrupting the audit trail.\n\n## Decision\n\nOnly `dev` and `prd-writer` have write access. All other agents are read-only by design — they analyze and report, they do not modify.\n\n## Tool Access\n\n| Agent | write | edit |\n|-------|-------|------|\n| dev | YES | YES |\n| prd-writer | YES | |\n| compliance | | |\n| analyst | | |\n| reviewer | | |\n| lint-build | | |\n| tester | | |\n| uat-signoff | | |\n| sharder | | |\n| req-analyst | | |\n| tech-analyst | | |\n| ux-analyst | | |\n| scenario-analyst | | |\n\n## Rationale\n\n- **Audit integrity** — compliance scoring must reflect what was actually built, not what the compliance agent changed\n- **Clear separation of concerns** — building and fixing are the dev agent's job; evaluation is everyone else's\n- **Prevents silent corruption** — a reviewer that can write could \"fix\" issues it finds, hiding them from the score\n- **prd-writer exception** — the PRD writer needs to write the PRD and checklist files, but not edit source code (no edit tool)\n\n## Alternatives Rejected\n\n- **All agents can write** — would corrupt the build/evaluate/fix separation\n- **Configurable per-agent** — adds complexity; the read-only default is correct for all evaluation roles\n\n## Related Concepts\n\n- [Agent Capability Matrix](../domain/agent-capability-matrix.md)\n- [Specialist Agents](../domain/specialist-agents.md)\n- [Pipeline Agents](../domain/pipeline-agents.md)\n- [Fast Track Architecture](../architecture/fast-track-architecture.md)\n"},{"filepath":"decisions/rpc-mode-for-subprocesses.md","content":"---\ntype: Decision\ntitle: RPC Mode for Subprocesses\ndescription: Decision to use pi's native RPC mode for agent communication, enabling mid-execution steering, session reuse, and structured JSON event streams.\nresource: ./README.md\ntags: [pi-extensions, decision, rpc, subprocess, stdin, stdout, steering]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Decision: RPC Mode for Subprocesses\n\n## Context\n\nExtensions need to spawn agents as subprocesses and communicate with them. The pi CLI offers multiple modes for agent execution.\n\n## Decision\n\nUse pi's native RPC mode (`--mode rpc`) for all agent subprocesses.\n\n## How It Works\n\n- stdin and stdout are piped\n- Tasks sent via stdin as `{\"type\": \"prompt\", \"message\": \"...\"}` — not as positional args\n- Output streams as JSON events (`message_update`, `agent_start`, `agent_end`, etc.)\n- Agents can be steered mid-execution via `{\"type\": \"steer\", \"message\": \"...\"}`\n- Agents can be aborted via `{\"type\": \"abort\"}`\n- Session reuse via `--session <file> -c` retains context across calls\n\n## Rationale\n\n- **Mid-execution steering** — watchdog timers can interrupt agents to request yield summaries; users can steer from the web UI\n- **Session reuse** — a dev agent keeps its conversation context across tasks, reducing repeated codebase scanning\n- **Structured events** — JSON stream enables logging, dashboard updates, and process tracking\n- **Process lifecycle control** — stdin.end() or keep-alive for follow-up messages\n\n## Alternatives Rejected\n\n- **JSON mode (`--mode json`)** — used by req-qa specialists for simpler one-shot calls, but lacks steering and session reuse\n- **Positional arg prompt** — no way to steer mid-execution or send follow-ups\n\n## Related Concepts\n\n- [Agent Subprocess Execution](../architecture/agent-subprocess-execution.md)\n- [Watchdog Timer System](../domain/watchdog-timer-system.md)\n- [Pipeline State System](../architecture/pipeline-state-system.md)\n- [Pipeline Dashboard Web](../components/pipeline-dashboard-web.md)\n"},{"filepath":"domain/agent-capability-matrix.md","content":"---\ntype: Domain\ntitle: Agent Capability Matrix\ndescription: Tool access matrix for all pipeline and specialist agents — only dev and prd-writer have write access; all others are read-only by design.\nresource: ./README.md\ntags: [pi-extensions, domain, agents, capabilities, tools, matrix, read-only]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Agent Capability Matrix\n\nAgent definitions live in `agents/` as markdown files with YAML frontmatter specifying `name`, `description`, and `tools`. The extensions scan three directories (first match wins):\n\n1. `<project>/.pi/agents/` — project-specific overrides\n2. `~/.pi/agent/agents/` — pi global agents\n3. `~/.pi-init/agents/` — custom agents (this repo)\n\n## Tool Access Matrix\n\n| Agent | read | write | edit | bash | grep | find | ls |\n|-------|------|-------|------|------|------|------|----|\n| dev | YES | YES | YES | YES | YES | YES | YES |\n| compliance | YES | | | YES | YES | YES | YES |\n| analyst | YES | | | | YES | YES | YES |\n| reviewer | YES | | | YES | YES | YES | YES |\n| lint-build | YES | | | YES | YES | YES | YES |\n| tester | YES | | | YES | YES | YES | YES |\n| uat-signoff | YES | | | YES | YES | YES | YES |\n| sharder | YES | | | | YES | YES | YES |\n| req-analyst | YES | | | YES | YES | YES | YES |\n| tech-analyst | YES | | | YES | YES | YES | YES |\n| ux-analyst | YES | | | | YES | YES | YES |\n| scenario-analyst | YES | | | YES | YES | YES | YES |\n| prd-writer | YES | YES | | | YES | YES | YES |\n\n## Design Principle\n\nOnly `dev` and `prd-writer` have write access. All other agents are read-only by design — they analyze and report, they do not modify. This prevents evaluation agents from silently changing code during scoring.\n\n## Related Concepts\n\n- [Read-Only Agents by Design](../decisions/read-only-agents-by-design.md)\n- [Specialist Agents](./specialist-agents.md)\n- [Pipeline Agents](./pipeline-agents.md)\n- [Agent Subprocess Execution](../architecture/agent-subprocess-execution.md)\n"},{"filepath":"domain/okf-curator-droid.md","content":"---\ntype: Domain\ntitle: OKF Curator Droid\ndescription: Curation agent that processes OKF inbox syntheses into permanent concept files, reads GitHub issues for context, and maintains knowledge indexes.\nresource: ./.factory/droids/okf-curator.md\ntags: [pi-extensions, domain, okf, curator, droid, curation, inbox, knowledge]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# OKF Curator Droid\n\n**File:** `.factory/droids/okf-curator.md`\n\nA Factory Droid that curates OKF inbox items into permanent knowledge concept files. It transforms session syntheses into well-structured, typed, searchable concepts.\n\n## Process\n\n1. Read all unprocessed inbox items in `knowledge/inbox/` (not in `inbox/processed/`)\n2. Read existing concept files in each concept directory\n3. Read relevant source code and git history for context\n4. Fetch and read GitHub issues referenced by `issue_refs` or `epic_refs` in inbox frontmatter\n5. For each inbox item, determine concept type and create/update files\n6. When a concept is superseded, move the old file to `deprecation/` and add a `supersedes` field\n7. Move processed inbox items to `knowledge/inbox/processed/`\n8. Update all `index.md` files\n9. Update `knowledge/log.md` with curation summary\n\n## Concept Type Routing\n\n| Inbox Content | Target Directory |\n|---------------|------------------|\n| Architectural changes | `architecture/` |\n| UI component work | `components/` |\n| Business logic changes | `domain/` |\n| Decisions with rationale | `decisions/` |\n| Workflow/process changes | `process/` |\n| Superseded patterns | `deprecation/` |\n| Current status updates | `state/` |\n\n## Tools\n\nRead, LS, Grep, Glob, Execute, Edit, Create, TodoWrite\n\n## Rules\n\n- Never delete a concept file — move superseded ones to `deprecation/`\n- One concept per file; do not mix types\n- Filenames are slugified versions of the title\n- Always include `issue_refs` when concepts relate to GitHub issues\n- Always update `index.md` files and `log.md`\n- Cross-link related concepts using markdown relative paths\n\n## Related Concepts\n\n- [OKF Pi Extension](../components/okf-extension.md)\n- [Current Repo State](../state/current-repo-state.md)\n"},{"filepath":"domain/pipeline-agents.md","content":"---\ntype: Domain\ntitle: Pipeline Agents (dev-pipeline)\ndescription: Sprint development agents — dev, compliance, reviewer, lint-build, tester, uat-signoff, and sharder — each handling a stage of the build/eval/fix/UAT cycle.\nresource: ./agents/dev-pipeline/\ntags: [pi-extensions, domain, agents, pipeline, dev, compliance, reviewer, tester, uat]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Pipeline Agents (dev-pipeline)\n\nPipeline agents defined in `agents/dev-pipeline/` and used by the dev-pipeline extension through the build, evaluate, fix, and UAT stages.\n\n## Agent Roster\n\n| Agent | Description | Tools | Role |\n|-------|-------------|-------|------|\n| `dev` | Autonomous development agent — implements tasks completely | read, write, edit, bash, grep, find, ls | Builds/fixes code (only agent that writes) |\n| `compliance` | Scores implementation against requirements | read, bash, grep, find, ls | Per-task scoring with JSON output |\n| `reviewer` | Reviews prototype vs spec, places TODOs | read, bash, grep, find, ls | 3-Wave Wave 1 review |\n| `lint-build` | Runs lint and build checks | read, bash, grep, find, ls | Quality verification |\n| `tester` | Runs tests and reports results | read, bash, grep, find, ls | Test execution |\n| `uat-signoff` | UAT sign-off agent | read, bash, grep, find, ls | Final UAT gate |\n| `sharder` | Task decomposition for large tasks | read, grep, find, ls | Splits complex tasks |\n\n## Dev Agent\n\nThe core builder. Receives a specific task with acceptance criteria and must complete it fully. For Fast Track, it builds entire epics in one prompt. For 3-Wave, it implements individual tasks sequentially. Explicitly instructed to extend existing code, not delete or rewrite working code from previous epics.\n\n## Compliance Agent\n\nCompares implementation against original requirements and outputs a percentage score with detailed gap analysis. Returns structured JSON with `score`, `summary`, `passed`, and `failed` arrays. Strict but fair — partially met requirements count as half. Does NOT modify any files.\n\n## Related Concepts\n\n- [Agent Capability Matrix](./agent-capability-matrix.md)\n- [Dev-Pipeline Extension](../components/dev-pipeline-extension.md)\n- [Fast Track Architecture](../architecture/fast-track-architecture.md)\n- [Three-Wave Architecture](../architecture/three-wave-architecture.md)\n- [Model Configuration](../architecture/model-configuration.md)\n"},{"filepath":"domain/specialist-agents.md","content":"---\ntype: Domain\ntitle: Specialist Agents (req-qa)\ndescription: Requirements discovery specialist agents — req-analyst, tech-analyst, ux-analyst, scenario-analyst, and prd-writer — each focused on a domain of analysis.\nresource: ./agents/req-qa/\ntags: [pi-extensions, domain, agents, specialist, req-qa, requirements, prd]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Specialist Agents (req-qa)\n\nSpecialist agents called by the req-qa orchestrator during requirements discovery. Each is spawned as a pi subprocess with a domain-specific system prompt.\n\n## Agent Roster\n\n| Agent | Focus | Tools | Output Format |\n|-------|-------|-------|---------------|\n| `req-analyst` | Functional/non-functional requirements, gaps, assumptions | read, bash, grep, find, ls | JSON: requirements, open questions, risks |\n| `tech-analyst` | Technical feasibility, stack analysis, deployment | read, bash, grep, find, ls | JSON: tech stack, constraints, data models |\n| `ux-analyst` | User journeys, workflows, edge cases, navigation | read, grep, find, ls | JSON: personas, stories, workflows |\n| `scenario-analyst` | Stress tests, failure modes, real-world validation | read, bash, grep, find, ls | JSON: scenarios, failure modes, stress points |\n| `prd-writer` | Synthesize all analysis into PRD + checklist | read, write, grep, find, ls | Markdown files (PRD.md + checklist) |\n\n## Consultation Modes\n\n- **Fast mode** (`deep: false`, default): Specialist gets NO file tools — pure prompt-based analysis. ~15s per call.\n- **Deep mode** (`deep: true`): Specialist gets file-reading tools + session persistence. Can examine the actual codebase. ~30-60s per call.\n\n## Sequential Consultation Flow\n\nThe orchestrator calls specialists sequentially: req-analyst -> tech-analyst -> scenario-analyst, presenting findings after each. The `prd-writer` is called last during `generate_artifacts` to synthesize everything.\n\n## Output Discipline\n\nAll specialist agents (except prd-writer) return structured JSON. They do NOT modify any files. Only `prd-writer` has write access, and only to produce the PRD and checklist.\n\n## Related Concepts\n\n- [Req-QA Extension](../components/req-qa-extension.md)\n- [Agent Capability Matrix](./agent-capability-matrix.md)\n- [Requirements Discovery Workflow](../process/requirements-discovery-workflow.md)\n- [Read-Only Agents by Design](../decisions/read-only-agents-by-design.md)\n"},{"filepath":"domain/uat-process.md","content":"---\ntype: Domain\ntitle: UAT Process\ndescription: Automated Playwright-based UAT — scenario generation per epic, browser execution, results posting to GitHub issues, and approval gate.\nresource: ./extensions/dev-pipeline.ts\ntags: [pi-extensions, domain, uat, playwright, browser, scenarios, approval, testing]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# UAT Process\n\nThe Fast Track pipeline includes automated UAT via Playwright browser automation, with an explicit approval gate before merge.\n\n## UAT Scenario Generation\n\nAfter compliance is resolved for each epic, the evaluator generates test scenarios. Each scenario becomes a GitHub issue under a UAT parent epic:\n\n```\nUAT Epic #101: \"UAT Test Suite\"                    [uat]\n  +-- #102: \"UAT: Canvas renders correctly\"         [uat-pending, epic-1]\n  +-- #103: \"UAT: Game loop 60 FPS\"                [uat-pending, epic-1]\n```\n\nEach issue body contains: epic name, inputs, steps, and expected outcomes.\n\nLabels are created automatically: `uat`, `uat-pending`, `uat-pass`, `uat-fail`, `epic-N`.\n\n## UAT Execution\n\nOnce every epic passes, the pipeline runs the full UAT suite:\n\n1. **Server startup** — starts `python3 -m http.server 8080` if not already running\n2. **Scenario execution** — for each scenario: Playwright navigates, executes steps (click, type, press key, wait), takes snapshots, records pass/fail per step\n3. **Results posting** — posts a comment on each scenario issue with per-step results\n4. **Label updates** — `uat-pending` replaced with `uat-pass` or `uat-fail`\n\n## Approval Gate\n\nThe pipeline halts and waits for user decision. The dashboard flashes \"AWAITING UAT APPROVAL\" (yellow, 2Hz).\n\n### Approve (`/pipeline-approve`)\n- Closes the UAT epic on GitHub\n- Closes all passed scenario issues\n- Proceed to `/pipeline-end` for squash merge and push\n\n### Reject (`/pipeline-reject`)\n- User provides rejection notes\n- Notes posted as comments on failed scenario issues\n- Failed scenarios reset to `uat-pending`\n- Run `/pipeline-next` to trigger fix cycle; UAT re-runs only previously failed scenarios\n\n## Related Concepts\n\n- [Fast Track Architecture](../architecture/fast-track-architecture.md)\n- [GitHub Integration](../architecture/github-integration.md)\n- [Pipeline State System](../architecture/pipeline-state-system.md)\n- [Sprint Development Workflow](../process/sprint-development-workflow.md)\n"},{"filepath":"domain/watchdog-timer-system.md","content":"---\ntype: Domain\ntitle: Watchdog Timer System\ndescription: Per-depth timeout system for fix agents with steer-for-summary at T-30s, hard yield at T, analyst escalation, and learnings persistence.\nresource: ./extensions/dev-pipeline.ts\ntags: [pi-extensions, domain, watchdog, timeout, escalation, analyst, learnings, yield]\ntimestamp: 2026-06-29T15:00:00Z\nstatus: active\n---\n\n# Watchdog Timer System\n\nWhen a task scores below 95% in Fast Track mode, each fix attempt runs under a watchdog timer. If the agent can't finish in time, it's steered to yield a structured summary, and an analyst agent decides how to proceed.\n\n## Timeout Progression\n\n| Depth | Timeout | Model | Thinking |\n|-------|---------|-------|----------|\n| 1 | 10 min | Qwen 3.5+ (base fixer) | high |\n| 2 | 15 min | Claude Sonnet 4.6 (escalation 1) | high |\n| 3 | 20 min | Claude Opus 4.6 (escalation 2) | xhigh |\n| 4 | 25 min | Claude Opus 4.6 (clamped) | xhigh |\n| 5 | 30 min | Claude Opus 4.6 (clamped) | xhigh |\n\n## Yield Mechanism\n\n- At **T-30 seconds**, the watchdog steers the agent: \"TIMEOUT WARNING: yield NOW and provide a JSON summary of blockers, attempted approaches, and suggestions.\"\n- At **T**, the agent is aborted and killed.\n- The captured yield summary includes: `{blockers, attempted, suggestion}`.\n\n## Analyst Decisions\n\n| Action | Effect |\n|--------|--------|\n| `decompose` | Breaks the task into smaller sub-tasks for the next fix depth |\n| `simplify` | Reduces the task scope — overwrites requirements with a simpler version |\n| `deprecate` | Marks the task as infeasible — stops trying, moves on |\n| `skip` | Skips for now — records conditions under which to retry |\n\n## Learnings Flow\n\n1. Each fix attempt records an `AgentLearning` (blockers, attempted approaches, suggestion, analyst decision)\n2. Learnings are posted as structured comments on the task's GitHub issue\n3. Subsequent fix agents receive all prior learnings with \"DO NOT repeat approaches that have already been tried\"\n4. On pipeline restart, learnings are seeded from issue comments — they survive crashes\n\n## Existing Code Preservation\n\nFixes are additive or corrective, never destructive. Existing working code is always preserved.\n\n## Related Concepts\n\n- [Fast Track Architecture](../architecture/fast-track-architecture.md)\n- [GitHub Integration](../architecture/github-integration.md)\n- [Agent Subprocess Execution](../architecture/agent-subprocess-execution.md)\n- [Model Configuration](../architecture/model-configuration.md)\n- [Fast Track Walkthrough](../process/fast-track-walkthrough.md)\n"},{"filepath":"inbox/2026-06-29-20-49-17-feat-okf-add-okf-system-remove-paraffine-deploy-kn.md","content":"---\ntype: Inbox\ntitle: feat(okf): add OKF system, remove PARAFFINE, deploy knowled
